name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: ${{ matrix.ecosystem }} benchmarks
    strategy:
      fail-fast: false
      matrix:
        include:
          - ecosystem: OCI
            package: peryx-ecosystem-oci
          - ecosystem: PyPI
            package: peryx-ecosystem-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just cargo:cargo-codspeed
      - run: just codspeed-build "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: just codspeed-run "${{ matrix.package }}"

  codspeed-gate:
    if: always()
    needs: benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: needs.benchmarks.result != 'success'
        run: exit 1
