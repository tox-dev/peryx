# Manual runs build release artifacts without publishing them.
name: publish-pypi
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: wheel ${{ matrix.platform.os }}-${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, compatibility: "2_28", zig: true }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, compatibility: "2_28", zig: true }
          - { os: linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, compatibility: musllinux_1_2, zig: true }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, compatibility: musllinux_1_2, zig: true }
          - { os: macos, runner: macos-26, target: aarch64, rust_target: aarch64-apple-darwin }
          - { os: macos, runner: macos-26, target: x86_64, rust_target: x86_64-apple-darwin }
          - { os: windows, runner: windows-2025, target: x64, rust_target: x86_64-pc-windows-msvc }
          - { os: windows, runner: windows-11-arm, target: aarch64, rust_target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.platform.rust_target || matrix.platform.target }}
          tools: just maturin ${{ matrix.platform.os == 'linux' && 'zig' || '' }}
      - name: Build wheel
        env:
          RUST_TARGET: ${{ matrix.platform.rust_target || matrix.platform.target }}
          COMPATIBILITY: ${{ matrix.platform.compatibility }}
          RUSTC_WRAPPER: sccache
          USE_ZIG: ${{ matrix.platform.zig }}
        shell: bash
        run: |
          args=(--target "$RUST_TARGET")
          [[ -z $COMPATIBILITY ]] || args+=(--compatibility "$COMPATIBILITY")
          [[ -z $USE_ZIG ]] || args+=(--zig)
          just package-wheel "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just maturin
      - name: Build sdist
        run: just package-sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: ${{ github.event_name != 'workflow_dispatch' }}
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      attestations: write # Sign the Python packages.
      contents: read # Read release metadata.
      id-token: write # Authenticate to PyPI without a stored token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Attest Python packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
