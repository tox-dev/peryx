name: Browser dependencies

on:
  schedule:
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just node
      - run: just browser-update
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          assignees: gaborbernat
          branch: automation/browser-dependencies
          commit-message: "⬆️ build(deps): update browser tools"
          delete-branch: true
          labels: enhancement
          title: "⬆️ build(deps): update browser tools"
          body: |
            Playwright and Puppeteer require the matching Chrome for Testing revision selected by each package release. This weekly update keeps those package and browser inputs aligned.

            The browser lock recipe records each archive URL with the SHA-256 it computed from the download, then regenerates the committed Mermaid diagrams with the updated Puppeteer browser.
