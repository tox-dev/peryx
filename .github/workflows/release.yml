# Based on dist 0.33.0 output; this version keeps GitHub expressions out of shell commands.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#

name: Release
permissions:
  "contents": "read"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  plan:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 20
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag $TAG"
            exit 1
          fi
          version=${TAG#v}
          if ! grep -qE "^## ${version//./\\.} \\(" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
      - uses: $/.github/actions/setup
        with:
          tools: aqua:axodotdev/cargo-dist
      # mise installs dist outside ~/.cargo/bin, where the later jobs restore it from.
      - run: cp "$(mise which dist)" "$RUNNER_TEMP/dist"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      # Fork pull requests cannot access target-repository secrets.
      - id: plan
        env:
          TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            dist host --steps=create --tag="$TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    # An implicit name keeps skipped matrix jobs legible.
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # dist-workspace.toml enables cargo-auditable and cargo-cyclonedx, which dist calls during the build.
      - uses: $/.github/actions/setup
        with:
          tools: aqua:axodotdev/cargo-dist cargo:cargo-auditable cargo:cargo-cyclonedx
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build artifacts
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ join(matrix.targets, ',') }}
        shell: bash
        run: |
          args=(build --artifacts=local --target="$TARGETS" --print=linkage --output-format=json)
          if [[ -n "$TAG" ]]; then
            args+=(--tag="$TAG")
          fi
          dist "${args[@]}" > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # Bash writes action outputs consistently across runner platforms.
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          args=(build --artifacts=global --output-format=json)
          if [[ -n "$TAG" ]]; then
            args+=(--tag="$TAG")
          fi
          dist "${args[@]}" > dist-manifest.json
          echo "dist ran successfully"

          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  credits:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # GitHub's generate-notes endpoint requires write access without saving a release.
    outputs:
      source: ${{ github.sha }}
      previous: ${{ steps.previous.outputs.tag }}
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Find previous release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -v tag="$RELEASE_TAG" '$0 == tag { print previous; exit } { previous = $0 }')
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
      - name: Read generated contributor credits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          args=(-f "tag_name=$RELEASE_TAG")
          [[ -z "$PREVIOUS_TAG" ]] || args+=(-f "previous_tag_name=$PREVIOUS_TAG")
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/generated-notes.md"
      - name: Hash generated credits
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/generated-notes.md" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-credits
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error

  notes:
    needs:
      - plan
      - credits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source: ${{ github.sha }}
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-credits
          path: ${{ runner.temp }}/credits
      - name: Verify generated credits
        env:
          SOURCE_SHA: ${{ needs.credits.outputs.source }}
          CREDITS_SHA256: ${{ needs.credits.outputs.digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$CREDITS_SHA256" "$RUNNER_TEMP/credits/generated-notes.md" | sha256sum --check --status
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
      - name: Render changelog notes
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.credits.outputs.previous }}
          PUBLISH_PYPI: "${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}"
        run: |
          args=(--changelog CHANGELOG.md --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --generated-notes "$RUNNER_TEMP/credits/generated-notes.md")
          [[ -z "$PREVIOUS_TAG" ]] || args+=(--previous "$PREVIOUS_TAG")
          [[ "$PUBLISH_PYPI" != true ]] || args+=(--artifact-url "https://pypi.org/project/peryx/${RELEASE_TAG#v}/")
          "$RUNNER_TEMP/release-tools/bin/release-creator" notes "${args[@]}" > "$RUNNER_TEMP/changelog-notes.md"
      - name: Hash changelog notes
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/changelog-notes.md" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/changelog-notes.md
          if-no-files-found: error

  host:
    needs:
      - plan
      - notes
      - build-local-artifacts
      - build-global-artifacts
    if:
      ${{ always() && needs.plan.result == 'success' && needs.notes.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result
      == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 20
    permissions:
      "attestations": "write" # Sign release artifacts.
      "contents": "write" # Create the GitHub release.
      "id-token": "write" # Bind attestations to this workflow.
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/release-notes
      - name: Verify changelog notes
        env:
          SOURCE_SHA: ${{ needs.notes.outputs.source }}
          NOTES_SHA256: ${{ needs.notes.outputs.digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$NOTES_SHA256" "$RUNNER_TEMP/release-notes/changelog-notes.md" | sha256sum --check --status
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          dist host --tag="$TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          rm -f artifacts/*-dist-manifest.json
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Keep installer and verification instructions
        env:
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        run: |
          printf '%s\n' "$ANNOUNCEMENT_BODY" | sed -n '/^## Install /,$p' | sed '/^\[PyPI release\]/d; /^\*\*Full Changelog\*\*:/d' > "$RUNNER_TEMP/install-notes.md"
          test -s "$RUNNER_TEMP/install-notes.md"
      - name: Assemble release description
        run: |
          sed '/^\*\*Full Changelog\*\*:/d' "$RUNNER_TEMP/release-notes/changelog-notes.md" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/install-notes.md" >> "$RUNNER_TEMP/release-notes.md"
          sed -n '/^\*\*Full Changelog\*\*:/p' "$RUNNER_TEMP/release-notes/changelog-notes.md" >> "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
        run: gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" artifacts/*

  custom-publish-pypi:
    needs:
      - plan
      - host
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: $/.github/workflows/publish-pypi.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    permissions:
      "contents": "read" # Read the source to build from.

  # PyPI matches the token's job_workflow_ref and the attestation certificate's build config against one
  # trusted publisher; only a job in this top-level workflow makes both name release.yml.
  publish-pypi:
    name: publish to PyPI
    needs:
      - custom-publish-pypi
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    environment: pypi
    permissions:
      "attestations": "write" # Sign the Python packages.
      "contents": "read" # Read release metadata.
      "id-token": "write" # Authenticate to PyPI without a stored token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Attest Python packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  announce:
    needs:
      - plan
      - host
      - custom-publish-pypi
      - publish-pypi
    # Wait for skipped prerelease jobs, but require host completion.
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-pypi.result == 'skipped' || needs.publish-pypi.result == 'success') }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
