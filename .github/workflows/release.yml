# Based on dist 0.33.0 output; this version keeps GitHub expressions out of shell commands.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
name: 🚀 Release
permissions:
  "contents": "read"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
jobs:
  plan:
    name: ⚙️ Plan release
    runs-on: "ubuntu-22.04"
    timeout-minutes: 45
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      publishing: ${{ !github.event.pull_request }}
      dist-cache-artifact-id: ${{ steps.dist-cache.outputs.artifact-id }}
      plan-artifact-id: ${{ steps.plan-manifest.outputs.artifact-id }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: 🧰 Set up Rust and tools
        uses: $/.github/actions/setup
        with:
          tools: aqua:axodotdev/cargo-dist
      # mise installs dist outside ~/.cargo/bin, where the later jobs restore it from.
      - name: ⚙️ Stage dist binary
        run: cp "$(mise which dist)" "$RUNNER_TEMP/dist"
      - name: 📤 Cache dist
        id: dist-cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      # Fork pull requests cannot access target-repository secrets.
      - name: ⚙️ Compute release plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            dist host --steps=create --tag="$TAG" --output-format=json >plan-dist-manifest.json
          else
            dist plan --output-format=json >plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >>"$GITHUB_OUTPUT"
      - name: 📤 Upload dist-manifest.json
        id: plan-manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
  build-local-artifacts:
    name: 🏗️ Build local artifacts
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: ⚙️ Enable Windows long paths
        run: |
          git config --global core.longpaths true
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # dist-workspace.toml enables cargo-auditable and cargo-cyclonedx, which dist calls during the build.
      - name: 🧰 Set up Rust and tools
        uses: $/.github/actions/setup
        with:
          tools: aqua:axodotdev/cargo-dist cargo:cargo-auditable cargo:cargo-cyclonedx
      - name: 📩 Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-artifact-id }}
          path: target/distrib/
      - name: 🏗️ Build artifacts
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ join(matrix.targets, ',') }}
        shell: bash
        run: |
          args=(build --artifacts=local --target="$TARGETS" --print=linkage --output-format=json)
          if [[ -n "$TAG" ]]; then
            args+=(--tag="$TAG")
          fi
          dist "${args[@]}" >dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: ⚙️ List files to upload
        # Bash writes action outputs consistently across runner platforms.
        shell: bash
        run: |
          echo "paths<<EOF" >>"$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >>"$GITHUB_OUTPUT"
          echo "EOF" >>"$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          if-no-files-found: error
  build-global-artifacts:
    name: 🏗️ Build global artifacts
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: 🧰 Set up Rust and tools
        uses: $/.github/actions/setup
        with:
          tools: cargo:cargo-cyclonedx
      - name: 📩 Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          artifact-ids: ${{ needs.plan.outputs.dist-cache-artifact-id }}
          path: ~/.cargo/bin/
      - name: ⚙️ Make dist executable
        run: chmod +x ~/.cargo/bin/dist
      - name: 📩 Fetch release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-artifact-id }}
          path: target/distrib/
      - name: 📩 Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/local-artifacts
      - name: 🔍 Assemble and check local artifacts
        uses: $/.github/actions/assemble-dist-artifacts
        with:
          plan: target/distrib/plan-dist-manifest.json
          local-directory: ${{ runner.temp }}/local-artifacts
          output-directory: target/distrib
      - name: 🏗️ Build global artifacts
        id: cargo-dist
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          args=(build --artifacts=global --output-format=json)
          if [[ -n "$TAG" ]]; then
            args+=(--tag="$TAG")
          fi
          dist "${args[@]}" >dist-manifest.json
          echo "dist ran successfully"

          echo "paths<<EOF" >>"$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >>"$GITHUB_OUTPUT"
          echo "EOF" >>"$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: 🏗️ Generate planned CycloneDX manifest
        run: |
          cargo cyclonedx --manifest-path crates/peryx/Cargo.toml --format xml --target all --override-filename peryx.cdx
          cp crates/peryx/peryx.cdx.xml target/distrib/peryx.cdx.xml
      - name: 📤 Upload artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          if-no-files-found: error
  notes:
    name: 📝 Render GitHub Release notes
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Select PyPI release link
        id: artifact
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PUBLISH_PYPI: "${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}"
        run: |
          [[ "$PUBLISH_PYPI" != true ]] || echo "url=https://pypi.org/project/peryx/${RELEASE_TAG#v}/" >>"$GITHUB_OUTPUT"
      - name: 📝 Render changelog notes
        uses: tox-dev/github-workflows/render-release-notes@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        with:
          tag: ${{ needs.plan.outputs.tag }}
          changelog: CHANGELOG.md
          artifact-url: ${{ steps.artifact.outputs.url }}
      - name: ⚙️ Hash changelog notes
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/release-notes.md" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: 📤 Upload changelog notes
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  host:
    name: 🚀 Host release artifacts
    needs:
      - plan
      - notes
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.notes.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      val: ${{ steps.host.outputs.manifest }}
      notes-digest: ${{ steps.final-notes.outputs.sha256 }}
      assets-digest: ${{ steps.assets.outputs.sha256 }}
      assets-artifact-id: ${{ steps.upload-assets.outputs.artifact-id }}
      assets-sha256-artifact-id: ${{ steps.upload-assets-sha256.outputs.artifact-id }}
      notes-artifact-id: ${{ steps.upload-notes.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: 📩 Download changelog notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-notes
      - name: 🔍 Verify changelog notes
        env:
          NOTES_SHA256: ${{ needs.notes.outputs.digest }}
        run: printf '%s  %s\n' "$NOTES_SHA256" "$RUNNER_TEMP/release-notes/release-notes.md" | sha256sum --check --status
      - name: 📩 Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          artifact-ids: ${{ needs.plan.outputs.dist-cache-artifact-id }}
          path: ~/.cargo/bin/
      - name: ⚙️ Make dist executable
        run: chmod +x ~/.cargo/bin/dist
      - name: 📩 Fetch release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-artifact-id }}
          path: target/distrib/
      - name: 📩 Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/local-artifacts
      - name: 📩 Fetch global artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-global-artifacts.outputs.artifact-id }}
          path: ${{ runner.temp }}/global-artifacts
      - name: 🔍 Assemble and check release artifacts
        uses: $/.github/actions/assemble-dist-artifacts
        with:
          plan: target/distrib/plan-dist-manifest.json
          local-directory: ${{ runner.temp }}/local-artifacts
          global-directory: ${{ runner.temp }}/global-artifacts
          output-directory: target/distrib
      - name: ⚙️ Select planned release assets
        id: assets
        run: |
          mkdir artifacts
          jq -r '.artifacts | keys[]' target/distrib/plan-dist-manifest.json | while IFS= read -r name; do
            cp "target/distrib/$name" artifacts/
          done
          sha256sum artifacts/* >"$RUNNER_TEMP/release-assets.sha256"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/release-assets.sha256" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: 🚀 Host release with dist
        id: host
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          dist host --tag="$TAG" --steps=upload --steps=release --output-format=json >dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >>"$GITHUB_OUTPUT"
      - name: 🔍 Check selected release assets
        run: sha256sum --check --status "$RUNNER_TEMP/release-assets.sha256"
      - name: 📤 Upload dist-manifest.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: 📤 Upload release assets
        id: upload-assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: artifacts
          if-no-files-found: error
      - name: 📤 Upload release asset checksums
        id: upload-assets-sha256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-sha256
          path: ${{ runner.temp }}/release-assets.sha256
          if-no-files-found: error
      - name: 📝 Keep installer and verification instructions
        env:
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        run: |
          printf '%s\n' "$ANNOUNCEMENT_BODY" | sed -n '/^## Install /,$p' | sed '/^\[PyPI release\]/d; /^\*\*Full Changelog\*\*:/d' >"$RUNNER_TEMP/install-notes.md"
      - name: 📝 Assemble release description
        run: |
          sed '/^\*\*Full Changelog\*\*:/d' "$RUNNER_TEMP/release-notes/release-notes.md" >"$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/install-notes.md" >>"$RUNNER_TEMP/release-notes.md"
          sed -n '/^\*\*Full Changelog\*\*:/p' "$RUNNER_TEMP/release-notes/release-notes.md" >>"$RUNNER_TEMP/release-notes.md"
      - name: ⚙️ Hash changelog notes
        id: final-notes
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/release-notes.md" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: 📤 Upload final release notes
        id: upload-notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  attest-release-assets:
    name: 🧾 Attest release artifacts
    needs: host
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: 📩 Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.host.outputs.assets-artifact-id }}
          path: artifacts
      - name: 📩 Download release asset checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.host.outputs.assets-sha256-artifact-id }}
          path: ${{ runner.temp }}/assets
      - name: 🔍 Verify assets before attestation
        env:
          ASSETS_SHA256: ${{ needs.host.outputs.assets-digest }}
        run: |
          printf '%s  %s\n' "$ASSETS_SHA256" "$RUNNER_TEMP/assets/release-assets.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/assets/release-assets.sha256"
          awk '{print $2}' "$RUNNER_TEMP/assets/release-assets.sha256" | sort >"$RUNNER_TEMP/expected-assets.txt"
          find artifacts -mindepth 1 -maxdepth 1 -type f -printf '%p\n' | sort >"$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - name: 🧾 Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: 🔍 Verify assets after attestation
        run: sha256sum --check --status "$RUNNER_TEMP/assets/release-assets.sha256"
  custom-publish-pypi:
    name: 🏗️ Build distributions
    needs:
      - plan
      - attest-release-assets
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: $/.github/workflows/publish-pypi.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    permissions:
      "contents": "read" # Read the source to build from.
  validate-pypi-artifacts:
    name: 🔍 Validate distributions
    needs:
      - plan
      - custom-publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.manifest.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📩 Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: wheels
      - name: ⚙️ Assemble expected Python artifacts
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir dist
          while read -r artifact platform; do
            cp "wheels/$artifact/peryx-$version-py3-none-$platform.whl" dist/
          done <<'WHEELS'
          wheels-linux-aarch64-unknown-linux-gnu manylinux_2_28_aarch64
          wheels-linux-aarch64-unknown-linux-musl musllinux_1_2_aarch64
          wheels-linux-x86_64-unknown-linux-gnu manylinux_2_28_x86_64
          wheels-linux-x86_64-unknown-linux-musl musllinux_1_2_x86_64
          wheels-macos-aarch64 macosx_11_0_arm64
          wheels-macos-x86_64 macosx_10_12_x86_64
          wheels-windows-aarch64 win_arm64
          wheels-windows-x64 win_amd64
          WHEELS
          cp "wheels/wheels-sdist/peryx-$version.tar.gz" dist/
      - name: ⚙️ Hash checked artifacts
        id: manifest
        run: |
          sha256sum dist/* >"$RUNNER_TEMP/python-artifacts.sha256"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/python-artifacts.sha256" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: 📤 Upload artifact checksums
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-artifacts-sha256
          path: ${{ runner.temp }}/python-artifacts.sha256
          if-no-files-found: error
  publish-pypi:
    name: 🚀 Publish to PyPI
    needs:
      - validate-pypi-artifacts
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    environment: pypi
    permissions:
      "attestations": "write" # Sign the Python packages.
      "contents": "read" # Read release metadata.
      "id-token": "write" # Authenticate to PyPI without a stored token.
    steps:
      - name: 📩 Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: 📩 Download artifact checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate-pypi-artifacts.outputs.artifact-id }}
          path: ${{ runner.temp }}/checks
      - name: 🔍 Verify checked artifacts
        env:
          MANIFEST_SHA256: ${{ needs.validate-pypi-artifacts.outputs.digest }}
        run: |
          printf '%s  %s\n' "$MANIFEST_SHA256" "$RUNNER_TEMP/checks/python-artifacts.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/checks/python-artifacts.sha256"
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$RUNNER_TEMP/checks/python-artifacts.sha256")"
      - name: 🧾 Attest Python packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: 🔍 Verify artifacts after attestation
        run: |-
          sha256sum --check --status "$RUNNER_TEMP/checks/python-artifacts.sha256"
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
  verify-pypi-artifacts:
    name: 🔍 Verify PyPI distributions
    needs:
      - plan
      - validate-pypi-artifacts
      - publish-pypi
    if: |-
      ${{ always() && needs.validate-pypi-artifacts.result == 'success' && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📩 Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: 📩 Download artifact checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate-pypi-artifacts.outputs.artifact-id }}
          path: ${{ runner.temp }}/checks
      - name: 🔍 Verify checked artifacts
        env:
          MANIFEST_SHA256: ${{ needs.validate-pypi-artifacts.outputs.digest }}
        run: |
          printf '%s  %s\n' "$MANIFEST_SHA256" "$RUNNER_TEMP/checks/python-artifacts.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/checks/python-artifacts.sha256"
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$RUNNER_TEMP/checks/python-artifacts.sha256")"
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🔍 Verify PyPI artifacts
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        with:
          project: peryx
          version: ${{ fromJson(needs.plan.outputs.val).releases[0].app_version }}
          dist: dist
  announce:
    name: 🚀 Publish GitHub Release
    needs:
      - plan
      - host
      - attest-release-assets
      - verify-pypi-artifacts
    if: |-
      ${{
        always() &&
        needs.host.result == 'success' &&
        needs.attest-release-assets.result == 'success' &&
        (needs.verify-pypi-artifacts.result == 'success' ||
          (needs.verify-pypi-artifacts.result == 'skipped' &&
            fromJson(needs.plan.outputs.val).announcement_is_prerelease &&
            !fromJson(needs.plan.outputs.val).publish_prereleases))
      }}
    runs-on: "ubuntu-22.04"
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 📩 Download final release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.host.outputs.notes-artifact-id }}
          path: ${{ runner.temp }}/release-notes
      - name: 🔍 Verify final release description
        env:
          NOTES_SHA256: ${{ needs.host.outputs.notes-digest }}
        run: printf '%s  %s\n' "$NOTES_SHA256" "$RUNNER_TEMP/release-notes/release-notes.md" | sha256sum --check --status
      - name: 📩 Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          artifact-ids: ${{ needs.host.outputs.assets-artifact-id }}
          path: artifacts
      - name: 🚀 Publish GitHub Release
        uses: tox-dev/github-workflows/publish-github-release@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ needs.plan.outputs.tag }}
          commit: ${{ github.sha }}
          title: ${{ fromJson(needs.host.outputs.val).announcement_title }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
          assets-directory: artifacts
          prerelease: ${{ fromJson(needs.host.outputs.val).announcement_is_prerelease }}
