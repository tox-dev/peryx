# Based on dist 0.33.0 output; this version keeps GitHub expressions out of shell commands.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
name: Release
permissions:
  "contents": "read"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
jobs:
  plan:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 45
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      source: ${{ github.sha }}
      publishing: ${{ !github.event.pull_request }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag $TAG"
            exit 1
          fi
          version=${TAG#v}
          if ! grep -qE "^## ${version//./\\.} \\(" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
      - uses: $/.github/actions/setup
        with:
          tools: aqua:axodotdev/cargo-dist prek
      # mise installs dist outside ~/.cargo/bin, where the later jobs restore it from.
      - run: cp "$(mise which dist)" "$RUNNER_TEMP/dist"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      # Fork pull requests cannot access target-repository secrets.
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            dist host --steps=create --tag="$TAG" --output-format=json >plan-dist-manifest.json
          else
            dist plan --output-format=json >plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >>"$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
      - name: Check tagged source
        run: prek run --all-files
  build-local-artifacts:
    # An implicit name keeps skipped matrix jobs legible.
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # dist-workspace.toml enables cargo-auditable and cargo-cyclonedx, which dist calls during the build.
      - uses: $/.github/actions/setup
        with:
          tools: aqua:axodotdev/cargo-dist cargo:cargo-auditable cargo:cargo-cyclonedx
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: artifacts-plan-dist-manifest
          path: target/distrib/
      - name: Build artifacts
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGETS: ${{ join(matrix.targets, ',') }}
        shell: bash
        run: |
          args=(build --artifacts=local --target="$TARGETS" --print=linkage --output-format=json)
          if [[ -n "$TAG" ]]; then
            args+=(--tag="$TAG")
          fi
          dist "${args[@]}" >dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # Bash writes action outputs consistently across runner platforms.
        shell: bash
        run: |
          echo "paths<<EOF" >>"$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >>"$GITHUB_OUTPUT"
          echo "EOF" >>"$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          if-no-files-found: error
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: $/.github/actions/setup
        with:
          tools: cargo:cargo-cyclonedx
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: artifacts-plan-dist-manifest
          path: target/distrib/
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/local-artifacts
      - name: Check local artifact handoff
        uses: $/.github/actions/assemble-dist-artifacts
        with:
          plan: target/distrib/plan-dist-manifest.json
          local-directory: ${{ runner.temp }}/local-artifacts
          output-directory: target/distrib
          source: ${{ needs.plan.outputs.source }}
          tag: ${{ needs.plan.outputs.tag }}
      - id: cargo-dist
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          args=(build --artifacts=global --output-format=json)
          if [[ -n "$TAG" ]]; then
            args+=(--tag="$TAG")
          fi
          dist "${args[@]}" >dist-manifest.json
          echo "dist ran successfully"

          echo "paths<<EOF" >>"$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >>"$GITHUB_OUTPUT"
          echo "EOF" >>"$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Generate planned CycloneDX manifest
        run: |
          cargo cyclonedx --manifest-path crates/peryx/Cargo.toml --format xml --target all --override-filename peryx.cdx
          cp crates/peryx/peryx.cdx.xml target/distrib/peryx.cdx.xml
      - name: Check planned global files
        run: jq -r '.upload_files[]' dist-manifest.json | while IFS= read -r path; do test -s "$path"; done
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          if-no-files-found: error
  credits:
    needs: plan
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    permissions:
      contents: write # GitHub's generate-notes endpoint requires write access without saving a release.
    outputs:
      source: ${{ github.sha }}
      previous: ${{ steps.previous.outputs.previous }}
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/install-locked-tools@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Find previous release
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          tag: ${{ needs.plan.outputs.tag }}
          executable: ${{ runner.temp }}/release-tools/bin/release-creator
          stable-only: "true"
      - name: Read generated contributor credits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.previous }}
        run: |
          args=(-f "tag_name=$RELEASE_TAG")
          [[ -z "$PREVIOUS_TAG" ]] || args+=(-f "previous_tag_name=$PREVIOUS_TAG")
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Hash generated credits
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/generated-notes.md" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-credits
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  notes:
    needs:
      - plan
      - credits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source: ${{ github.sha }}
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-credits
          path: ${{ runner.temp }}/credits
      - name: Verify generated credits
        env:
          SOURCE_SHA: ${{ needs.credits.outputs.source }}
          CREDITS_SHA256: ${{ needs.credits.outputs.digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$CREDITS_SHA256" "$RUNNER_TEMP/credits/generated-notes.md" | sha256sum --check --status
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Render changelog notes
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.credits.outputs.previous }}
          PUBLISH_PYPI: "${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}"
        run: |
          args=(--changelog CHANGELOG.md --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --generated-notes "$RUNNER_TEMP/credits/generated-notes.md")
          [[ -z "$PREVIOUS_TAG" ]] || args+=(--previous "$PREVIOUS_TAG")
          [[ "$PUBLISH_PYPI" != true ]] || args+=(--artifact-url "https://pypi.org/project/peryx/${RELEASE_TAG#v}/")
          "$RUNNER_TEMP/release-tools/bin/release-creator" notes "${args[@]}" >"$RUNNER_TEMP/changelog-notes.md"
      - name: Hash changelog notes
        id: digest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/changelog-notes.md" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/changelog-notes.md
          if-no-files-found: error
  host:
    needs:
      - plan
      - notes
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.notes.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      val: ${{ steps.host.outputs.manifest }}
      source: ${{ github.sha }}
      notes-digest: ${{ steps.final-notes.outputs.sha256 }}
      assets-digest: ${{ steps.assets.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/release-notes
      - name: Verify changelog notes
        env:
          SOURCE_SHA: ${{ needs.notes.outputs.source }}
          NOTES_SHA256: ${{ needs.notes.outputs.digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$NOTES_SHA256" "$RUNNER_TEMP/release-notes/changelog-notes.md" | sha256sum --check --status
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: artifacts-plan-dist-manifest
          path: target/distrib/
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/local-artifacts
      - name: Fetch global artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-global
          path: ${{ runner.temp }}/global-artifacts
      - name: Check release artifact handoff
        uses: $/.github/actions/assemble-dist-artifacts
        with:
          plan: target/distrib/plan-dist-manifest.json
          local-directory: ${{ runner.temp }}/local-artifacts
          global-directory: ${{ runner.temp }}/global-artifacts
          output-directory: target/distrib
          source: ${{ needs.plan.outputs.source }}
          tag: ${{ needs.plan.outputs.tag }}
      - name: Select planned release assets
        id: assets
        run: |
          mkdir artifacts
          jq -r '.artifacts | keys[]' target/distrib/plan-dist-manifest.json | while IFS= read -r name; do
            case "$name" in '' | .* | */*)
              echo "::error::invalid release asset: $name" >&2
              exit 1
              ;;
            esac
            test -f "target/distrib/$name" && test ! -L "target/distrib/$name"
            cp "target/distrib/$name" artifacts/
          done
          sha256sum artifacts/* >"$RUNNER_TEMP/release-assets.sha256"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/release-assets.sha256" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - id: host
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          dist host --tag="$TAG" --steps=upload --steps=release --output-format=json >dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >>"$GITHUB_OUTPUT"
      - name: Check selected release assets
        run: sha256sum --check --status "$RUNNER_TEMP/release-assets.sha256"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: artifacts
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-sha256
          path: ${{ runner.temp }}/release-assets.sha256
          if-no-files-found: error
      - name: Keep installer and verification instructions
        env:
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        run: |
          printf '%s\n' "$ANNOUNCEMENT_BODY" | sed -n '/^## Install /,$p' | sed '/^\[PyPI release\]/d; /^\*\*Full Changelog\*\*:/d' >"$RUNNER_TEMP/install-notes.md"
          test -s "$RUNNER_TEMP/install-notes.md"
      - name: Assemble release description
        run: |
          sed '/^\*\*Full Changelog\*\*:/d' "$RUNNER_TEMP/release-notes/changelog-notes.md" >"$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/install-notes.md" >>"$RUNNER_TEMP/release-notes.md"
          sed -n '/^\*\*Full Changelog\*\*:/p' "$RUNNER_TEMP/release-notes/changelog-notes.md" >>"$RUNNER_TEMP/release-notes.md"
      - name: Hash final release description
        id: final-notes
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/release-notes.md" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  attest-release-assets:
    needs: host
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-sha256
          path: ${{ runner.temp }}/assets
      - name: Verify assets before attestation
        env:
          SOURCE_SHA: ${{ needs.host.outputs.source }}
          ASSETS_SHA256: ${{ needs.host.outputs.assets-digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/assets/release-assets.sha256" && test ! -L "$RUNNER_TEMP/assets/release-assets.sha256"
          test "$(find "$RUNNER_TEMP/assets" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          printf '%s  %s\n' "$ASSETS_SHA256" "$RUNNER_TEMP/assets/release-assets.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/assets/release-assets.sha256"
          test -z "$(find artifacts -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          awk '{print $2}' "$RUNNER_TEMP/assets/release-assets.sha256" | sort >"$RUNNER_TEMP/expected-assets.txt"
          find artifacts -mindepth 1 -maxdepth 1 -type f -printf '%p\n' | sort >"$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Verify assets after attestation
        run: sha256sum --check --status "$RUNNER_TEMP/assets/release-assets.sha256"
  stage-github-release:
    needs:
      - plan
      - host
      - attest-release-assets
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Verify final release description
        env:
          SOURCE_SHA: ${{ needs.host.outputs.source }}
          NOTES_SHA256: ${{ needs.host.outputs.notes-digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/release-notes/release-notes.md" && test ! -L "$RUNNER_TEMP/release-notes/release-notes.md"
          test "$(find "$RUNNER_TEMP/release-notes" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          printf '%s  %s\n' "$NOTES_SHA256" "$RUNNER_TEMP/release-notes/release-notes.md" | sha256sum --check --status
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-sha256
          path: ${{ runner.temp }}/assets
      - name: Verify staged release assets
        env:
          SOURCE_SHA: ${{ needs.host.outputs.source }}
          ASSETS_SHA256: ${{ needs.host.outputs.assets-digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/assets/release-assets.sha256" && test ! -L "$RUNNER_TEMP/assets/release-assets.sha256"
          test "$(find "$RUNNER_TEMP/assets" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          printf '%s  %s\n' "$ASSETS_SHA256" "$RUNNER_TEMP/assets/release-assets.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/assets/release-assets.sha256"
          test -z "$(find artifacts -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          awk '{print $2}' "$RUNNER_TEMP/assets/release-assets.sha256" | sort >"$RUNNER_TEMP/expected-assets.txt"
          find artifacts -mindepth 1 -maxdepth 1 -type f -printf '%p\n' | sort >"$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - name: Stage GitHub Release
        uses: tox-dev/github-workflows/publish-github-release@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ needs.plan.outputs.tag }}
          commit: ${{ github.sha }}
          title: ${{ fromJson(needs.host.outputs.val).announcement_title }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
          assets-directory: artifacts
          prerelease: ${{ fromJson(needs.host.outputs.val).announcement_is_prerelease }}
          mode: stage
  custom-publish-pypi:
    needs:
      - plan
      - stage-github-release
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: $/.github/workflows/publish-pypi.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    permissions:
      "contents": "read" # Read the source to build from.
  validate-pypi-artifacts:
    needs:
      - plan
      - custom-publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source: ${{ github.sha }}
      digest: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: wheels
      - name: Check builder artifact names
        run: |
          printf '%s\n' \
            wheels-linux-aarch64-unknown-linux-gnu \
            wheels-linux-aarch64-unknown-linux-musl \
            wheels-linux-x86_64-unknown-linux-gnu \
            wheels-linux-x86_64-unknown-linux-musl \
            wheels-macos-aarch64 \
            wheels-macos-x86_64 \
            wheels-sdist \
            wheels-windows-aarch64 \
            wheels-windows-x64 >"$RUNNER_TEMP/expected-wheel-artifacts.txt"
          find wheels -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort >"$RUNNER_TEMP/actual-wheel-artifacts.txt"
          diff -u "$RUNNER_TEMP/expected-wheel-artifacts.txt" "$RUNNER_TEMP/actual-wheel-artifacts.txt"
          test -z "$(find wheels -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
      - name: Assemble expected Python artifacts
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir dist
          while read -r artifact platform; do
            path="wheels/$artifact/peryx-$version-py3-none-$platform.whl"
            test -f "$path" && test ! -L "$path"
            test "$(find "wheels/$artifact" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
            cp "$path" dist/
          done <<'WHEELS'
          wheels-linux-aarch64-unknown-linux-gnu manylinux_2_28_aarch64
          wheels-linux-aarch64-unknown-linux-musl musllinux_1_2_aarch64
          wheels-linux-x86_64-unknown-linux-gnu manylinux_2_28_x86_64
          wheels-linux-x86_64-unknown-linux-musl musllinux_1_2_x86_64
          wheels-macos-aarch64 macosx_11_0_arm64
          wheels-macos-x86_64 macosx_10_12_x86_64
          wheels-windows-aarch64 win_arm64
          wheels-windows-x64 win_amd64
          WHEELS
          source="wheels/wheels-sdist/peryx-$version.tar.gz"
          test -f "$source" && test ! -L "$source"
          test "$(find wheels/wheels-sdist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          cp "$source" dist/
          test -z "$(find wheels -mindepth 2 ! -type f -print -quit)"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked package checks
        uses: tox-dev/github-workflows/install-locked-tools@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          venv: ${{ runner.temp }}/package-check
          groups: package-check
      - name: Require eight wheels
        run: test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 8
      - name: Require one source distribution
        run: test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
      - name: Reject unexpected artifacts
        run: |
          test -z "$(find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find dist -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' -print -quit)"
      - name: Check package metadata
        run: '"$RUNNER_TEMP/package-check/bin/twine" check dist/*'
      - name: Check wheel contents
        run: '"$RUNNER_TEMP/package-check/bin/check-wheel-contents" --no-config --ignore W007 dist/*.whl'
      - name: Hash checked artifacts
        id: manifest
        run: |
          sha256sum dist/* >"$RUNNER_TEMP/python-artifacts.sha256"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/python-artifacts.sha256" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-artifacts-sha256
          path: ${{ runner.temp }}/python-artifacts.sha256
          if-no-files-found: error
  publish-pypi:
    name: publish to PyPI
    needs:
      - validate-pypi-artifacts
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    environment: pypi
    permissions:
      "attestations": "write" # Sign the Python packages.
      "contents": "read" # Read release metadata.
      "id-token": "write" # Authenticate to PyPI without a stored token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-artifacts-sha256
          path: ${{ runner.temp }}/checks
      - name: Verify checked artifacts
        env:
          SOURCE_SHA: ${{ needs.validate-pypi-artifacts.outputs.source }}
          MANIFEST_SHA256: ${{ needs.validate-pypi-artifacts.outputs.digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$MANIFEST_SHA256" "$RUNNER_TEMP/checks/python-artifacts.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/checks/python-artifacts.sha256"
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$RUNNER_TEMP/checks/python-artifacts.sha256")"
      - name: Attest Python packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify artifacts after attestation
        run: |-
          sha256sum --check --status "$RUNNER_TEMP/checks/python-artifacts.sha256"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
  verify-pypi-artifacts:
    needs:
      - plan
      - validate-pypi-artifacts
      - publish-pypi
    if: |-
      ${{ always() && needs.validate-pypi-artifacts.result == 'success' && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-artifacts-sha256
          path: ${{ runner.temp }}/checks
      - name: Verify checked artifacts
        env:
          SOURCE_SHA: ${{ needs.validate-pypi-artifacts.outputs.source }}
          MANIFEST_SHA256: ${{ needs.validate-pypi-artifacts.outputs.digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$MANIFEST_SHA256" "$RUNNER_TEMP/checks/python-artifacts.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/checks/python-artifacts.sha256"
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq "$(wc -l <"$RUNNER_TEMP/checks/python-artifacts.sha256")"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Verify complete PyPI release
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          project: peryx
          version: ${{ fromJson(needs.plan.outputs.val).releases[0].app_version }}
          dist: dist
  announce:
    needs:
      - plan
      - host
      - stage-github-release
      - verify-pypi-artifacts
    if: |-
      ${{
        always() &&
        needs.host.result == 'success' &&
        needs.stage-github-release.result == 'success' &&
        (needs.verify-pypi-artifacts.result == 'success' ||
          (needs.verify-pypi-artifacts.result == 'skipped' &&
            fromJson(needs.plan.outputs.val).announcement_is_prerelease &&
            !fromJson(needs.plan.outputs.val).publish_prereleases))
      }}
    runs-on: "ubuntu-22.04"
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Verify final release description
        env:
          SOURCE_SHA: ${{ needs.host.outputs.source }}
          NOTES_SHA256: ${{ needs.host.outputs.notes-digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/release-notes/release-notes.md" && test ! -L "$RUNNER_TEMP/release-notes/release-notes.md"
          test "$(find "$RUNNER_TEMP/release-notes" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          printf '%s  %s\n' "$NOTES_SHA256" "$RUNNER_TEMP/release-notes/release-notes.md" | sha256sum --check --status
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          name: release-assets
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-sha256
          path: ${{ runner.temp }}/assets
      - name: Verify staged release assets
        env:
          SOURCE_SHA: ${{ needs.host.outputs.source }}
          ASSETS_SHA256: ${{ needs.host.outputs.assets-digest }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/assets/release-assets.sha256" && test ! -L "$RUNNER_TEMP/assets/release-assets.sha256"
          test "$(find "$RUNNER_TEMP/assets" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          printf '%s  %s\n' "$ASSETS_SHA256" "$RUNNER_TEMP/assets/release-assets.sha256" | sha256sum --check --status
          sha256sum --check --status "$RUNNER_TEMP/assets/release-assets.sha256"
          test -z "$(find artifacts -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          awk '{print $2}' "$RUNNER_TEMP/assets/release-assets.sha256" | sort >"$RUNNER_TEMP/expected-assets.txt"
          find artifacts -mindepth 1 -maxdepth 1 -type f -printf '%p\n' | sort >"$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
      - name: Publish GitHub Release
        uses: tox-dev/github-workflows/publish-github-release@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ needs.plan.outputs.tag }}
          commit: ${{ github.sha }}
          title: ${{ fromJson(needs.host.outputs.val).announcement_title }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
          assets-directory: artifacts
          prerelease: ${{ fromJson(needs.host.outputs.val).announcement_is_prerelease }}
          mode: publish
