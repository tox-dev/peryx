name: Prepare release
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # Resolve each merged change file to its pull request author.
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.source.outputs.sha }}
      patch-digest: ${{ steps.patch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          install_args: --locked github:knope-dev/knope prek uv
          cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@24e7c78489b6e2adb7b8f881761a5c2dbfe03fee
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - id: version
        run: |
          day="$(date -u +%Y).$(date -u +%-m%d)"
          last=$(git tag --list "v${day}.*" | sed "s/^v${day}\.//" | sort -n | tail -n 1)
          echo "version=${day}.$((${last:--1} + 1))" >>"$GITHUB_OUTPUT"
      - run: |
          if ! compgen -G ".changeset/*.md" >/dev/null; then
            echo "::error::no change files; add a .changeset/*.md file before preparing a release"
            exit 1
          fi
      - name: Link changesets to merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-creator fragments --format knope --repository "$GITHUB_REPOSITORY" --git --resolve-authors
      - name: Prepare release with Knope
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: knope prepare-release --verbose --override-version "$VERSION"
      - name: Add stable changelog anchors
        run: release-creator anchors --changelog CHANGELOG.md
      - name: Write release patch
        id: patch
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/release.patch"
          test -s "$RUNNER_TEMP/release.patch"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/release.patch" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
      - name: Check release patch
        run: prek run --all-files
      - name: Reject hook changes to release patch
        run: git diff HEAD --binary | cmp - "$RUNNER_TEMP/release.patch"
  push:
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - name: Apply release patch
        env:
          SOURCE_SHA: ${{ needs.assemble.outputs.source }}
          PATCH_SHA256: ${{ needs.assemble.outputs.patch-digest }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/release-patch/release.patch" | sha256sum --check --status
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          git reset --hard origin/main
          git apply --check "$RUNNER_TEMP/release-patch/release.patch"
          git apply --index "$RUNNER_TEMP/release-patch/release.patch"
      - name: Check release patch paths
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
            Cargo.toml | Cargo.lock | CHANGELOG.md | .changeset/*.md | site/static/openapi.json) ;;
            crates/peryx-ecosystem-oci/fuzz/Cargo.toml | crates/peryx-ecosystem-pypi/fuzz/Cargo.toml) ;;
            crates/peryx-ecosystem-oci/tests/system-suite/Cargo.toml) ;;
            crates/peryx-ecosystem-pypi/tests/system-suite/Cargo.toml) ;;
            *)
              echo "::error::unexpected release path: $path"
              exit 1
              ;;
            esac
          done < <(git diff --cached --name-only)
      - name: Check release patch file modes
        run: |
          set -euo pipefail
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            case "${fields[1]}" in
            100644) ;;
            000000)
              if [[ "${fields[0]}" != :100644 || "$path" != .changeset/*.md ]]; then
                echo "::error::unexpected release deletion: $path" >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::unexpected release file mode in $path: ${fields[1]}" >&2
              exit 1
              ;;
            esac
          done < <(git diff --cached --raw --no-renames -z)
      - name: Check release version and whitespace
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          grep -Fq "## $VERSION (" CHANGELOG.md
          grep -Fxq "version = \"$VERSION\"" Cargo.toml
          git diff --cached --check
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: tox-dev/github-workflows/commit-and-tag@24e7c78489b6e2adb7b8f881761a5c2dbfe03fee
        with:
          version: v${{ needs.assemble.outputs.version }}
          token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          message: "🔖 chore(release): v${{ needs.assemble.outputs.version }}"
