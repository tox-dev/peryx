name: 🏷️ Prepare release
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  assemble:
    name: 🏷️ Assemble release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # Resolve each merged change file to its pull request author.
    outputs:
      version: ${{ steps.version.outputs.version }}
      patch-digest: ${{ steps.patch.outputs.sha256 }}
      patch-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🧰 Install release tools with mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          install_args: --locked github:knope-dev/knope
          cache: false
      - name: 🐍 Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@29d4d5e6900db30502d7249043b59c18284a9777 # 6.2.0
        with:
          groups: release-prepare
          venv: ${{ runner.temp }}/release-tools
      - name: 🏷️ Choose release version
        id: version
        run: |
          day="$(date -u +%Y).$(date -u +%-m%d)"
          last=$(git tag --list "v${day}.*" | sed "s/^v${day}\.//" | sort -n | tail -n 1)
          echo "version=${day}.$((${last:--1} + 1))" >>"$GITHUB_OUTPUT"
      - name: 📝 Link changesets to merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-creator fragments --format knope --repository "$GITHUB_REPOSITORY"
      - name: 📝 Prepare release with Knope
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: knope prepare-release --verbose --override-version "$VERSION"
      - name: 📝 Add stable changelog anchors
        run: release-creator anchors --changelog CHANGELOG.md
      - name: ⚙️ Write release patch
        id: patch
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/release.patch"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/release.patch" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: 📤 Upload release patch
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  push:
    name: ⬆️ Push release commit and tag
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 📩 Download release patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.patch-artifact-id }}
          path: ${{ runner.temp }}/release-patch
      - name: ⚙️ Apply release patch
        env:
          PATCH_SHA256: ${{ needs.assemble.outputs.patch-digest }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/release-patch/release.patch" | sha256sum --check --status
          git fetch origin main
          git reset --hard origin/main
          git apply --index "$RUNNER_TEMP/release-patch/release.patch"
      - name: 🔍 Check release patch paths
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
            Cargo.toml | Cargo.lock | CHANGELOG.md | .changeset/*.md | site/static/openapi.json) ;;
            crates/peryx-ecosystem-oci/fuzz/Cargo.toml | crates/peryx-ecosystem-pypi/fuzz/Cargo.toml) ;;
            crates/peryx-ecosystem-oci/tests/system-suite/Cargo.toml) ;;
            crates/peryx-ecosystem-pypi/tests/system-suite/Cargo.toml) ;;
            *)
              echo "::error::unexpected release path: $path"
              exit 1
              ;;
            esac
          done < <(git diff --cached --name-only)
      - name: 🔍 Check release patch file modes
        run: |
          set -euo pipefail
          while IFS= read -r -d '' metadata && IFS= read -r -d '' path; do
            read -ra fields <<<"$metadata"
            case "${fields[1]}" in
            100644) ;;
            000000)
              if [[ "${fields[0]}" != :100644 || "$path" != .changeset/*.md ]]; then
                echo "::error::unexpected release deletion: $path" >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::unexpected release file mode in $path: ${fields[1]}" >&2
              exit 1
              ;;
            esac
          done < <(git diff --cached --raw --no-renames -z)
      - name: 🔑 Create release App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: 🏷️ Commit and tag release
        uses: tox-dev/github-workflows/commit-and-tag@29d4d5e6900db30502d7249043b59c18284a9777 # 6.2.0
        with:
          version: v${{ needs.assemble.outputs.version }}
          token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          message: "🔖 chore(release): v${{ needs.assemble.outputs.version }}"
