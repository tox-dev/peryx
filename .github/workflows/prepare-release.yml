# Commits the version bump and changelog to main and pushes the release tag, which starts release.yml.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; empty derives it from the pending change files
        required: false
        default: ""

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The token pushes past the main ruleset, and a tag pushed with GITHUB_TOKEN would not start release.yml.
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true # zizmor: ignore[artipacked] knope pushes the release commit and tag
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.14
          install_args: --locked github:knope-dev/knope prek uv
          cache: false
      - run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
      - run: knope prepare-release --verbose ${VERSION:+--override-version "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
