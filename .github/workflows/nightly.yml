name: Nightly

on:
  workflow_call:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  analysis:
    name: ${{ matrix.recipe }}
    strategy:
      fail-fast: false
      matrix:
        recipe: [features, direct-minimum, miri, loom]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          components: miri,rust-src
          tools: just cargo:cargo-hack
      - run: just "$RECIPE"
        env:
          RECIPE: ${{ matrix.recipe }}

  sanitizer-build:
    name: ${{ matrix.recipe }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: sanitizer-address
            sanitizer: address
          - recipe: sanitizer-thread
            sanitizer: thread
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          components: rust-src
          tools: just cargo:cargo-nextest
      - run: just sanitizer-archive "$SANITIZER" ".tox/$RECIPE.tar.zst"
        env:
          RECIPE: ${{ matrix.recipe }}
          SANITIZER: ${{ matrix.sanitizer }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.recipe }}
          path: .tox/${{ matrix.recipe }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sanitizer:
    name: ${{ matrix.recipe }} (${{ matrix.partition }}/8)
    needs: sanitizer-build
    strategy:
      fail-fast: false
      matrix:
        recipe: [sanitizer-address, sanitizer-thread]
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          tools: >-
            just uv cargo:cargo-nextest github:Shopify/toxiproxy
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ matrix.recipe }}
          path: .tox/sanitizer
      - run: just sanitizer-run ".tox/sanitizer/$RECIPE.tar.zst" "slice:$PARTITION/8"
        env:
          PARTITION: ${{ matrix.partition }}
          RECIPE: ${{ matrix.recipe }}

  mutation-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shard_count: ${{ steps.shards.outputs.count }}
      shards: ${{ steps.shards.outputs.indices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: >-
            just jq uv cargo:cargo-mutants cargo:cargo-nextest
            github:Shopify/toxiproxy
      - run: just mutation-baseline
      - id: shards
        run: |
          mutants=$(just mutation-count)
          shards=$(( (mutants + 255) / 256 ))
          echo "Planning $mutants mutants across $shards shards"
          echo "count=$shards" >> "$GITHUB_OUTPUT"
          echo "indices=$(jq --null-input --compact-output --argjson count "$shards" '[range(0; $count)]')" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation (${{ matrix.shard }}/${{ needs.mutation-baseline.outputs.shard_count }})
    needs: mutation-baseline
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-baseline.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: >-
            just uv cargo:cargo-mutants cargo:cargo-nextest
            github:Shopify/toxiproxy
      - run: just mutation "$SHARD/$SHARD_COUNT" true 2 skip 500
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.mutation-baseline.outputs.shard_count }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-${{ matrix.shard }}-${{ needs.mutation-baseline.outputs.shard_count }}
          path: .tox/mutants
          if-no-files-found: error

  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: peryx-ecosystem-pypi
            target: pypi_filename
          - package: peryx-ecosystem-oci
            target: oci_reference
          - package: peryx-ecosystem-oci
            target: oci_manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          tools: just cargo:cargo-fuzz
      - run: just fuzz "$PACKAGE" "$TARGET" 60
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}

  live-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just uv cargo:cargo-nextest
      - run: just e2e-live
