name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@a32ce094895292b19eea422fc6500f1ef1ae8d5f
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      python-version: "3.15"
      check-workflow: ci.yml
      commit-message: "build(deps): refresh release tools"
      pull-request-title: "build(deps): refresh release tools"
      pull-request-body: |-
        Refresh the full project lock and exact pre-commit hook package pins after the seven-day dependency cutoff.
