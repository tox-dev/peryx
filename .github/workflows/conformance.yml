name: OCI conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      oci: ${{ steps.filter.outputs.oci }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'crates/peryx-archive/**'
              - 'crates/peryx-core/**'
              - 'crates/peryx-driver/**'
              - 'crates/peryx-events/**'
              - 'crates/peryx-ha/**'
              - 'crates/peryx-ha-distributed/**'
              - 'crates/peryx-http/**'
              - 'crates/peryx-identity/**'
              - 'crates/peryx-index/**'
              - 'crates/peryx-plugin-registry/**'
              - 'crates/peryx-policy/**'
              - 'crates/peryx-pql/**'
              - 'crates/peryx-search/**'
              - 'crates/peryx-storage/**'
              - 'crates/peryx-upstream/**'
              - 'crates/peryx/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/conformance.yml'
              - 'justfile'
            oci:
              - 'crates/peryx-ecosystem-oci/**'

  conformance:
    name: distribution-spec conformance
    needs: changes
    if: >-
      needs.changes.outputs.oci == 'true' || needs.changes.outputs.shared == 'true' ||
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-workspace-crates: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Deny warnings through RUSTFLAGS, as the setup action does; its note says why not build.warnings.
          rustflags: -D warnings
          build-warnings: ""
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just
      - run: just conformance "$RUNNER_TEMP/conformance.test"

  conformance-gate:
    if: always()
    needs: [changes, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: >-
          needs.changes.result != 'success' ||
          (needs.conformance.result != 'success' && needs.conformance.result != 'skipped')
        run: exit 1
