name: OCI conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      oci: ${{ steps.filter.outputs.oci }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'crates/peryx-archive/**'
              - 'crates/peryx-core/**'
              - 'crates/peryx-driver/**'
              - 'crates/peryx-events/**'
              - 'crates/peryx-ha/**'
              - 'crates/peryx-ha-distributed/**'
              - 'crates/peryx-http/**'
              - 'crates/peryx-identity/**'
              - 'crates/peryx-index/**'
              - 'crates/peryx-plugin-registry/**'
              - 'crates/peryx-policy/**'
              - 'crates/peryx-pql/**'
              - 'crates/peryx-search/**'
              - 'crates/peryx-storage/**'
              - 'crates/peryx-upstream/**'
              - 'crates/peryx/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/conformance.yml'
              - 'scripts/ci/conformance'
              - 'crates/peryx-ecosystem-oci/tests/conformance/**'
              - 'justfile'
              - 'scripts/ci/check-job-results'
            oci:
              - 'crates/peryx-ecosystem-oci/**'

  conformance:
    name: distribution-spec conformance
    needs: changes
    if: >-
      needs.changes.outputs.oci == 'true' || needs.changes.outputs.shared == 'true' ||
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-workspace-crates: true
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - run: just conformance peryx-ecosystem-oci "$RUNNER_TEMP/conformance.test"

  conformance-gate:
    if: always()
    needs: [changes, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - name: Verify required jobs
        env:
          CI_CONTEXT: >-
            {"event":"${{ github.event_name }}","oci":${{ needs.changes.outputs.oci == 'true' }},
            "shared":${{ needs.changes.outputs.shared == 'true' }}}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: just ci-gate conformance
