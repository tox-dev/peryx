name: Label bot news
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] The resolver verifies the run and current PR head; no PR code runs here.
    workflows: [News label source]
    types: [completed]
permissions: {}
jobs:
  label:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - id: pr
        uses: tox-dev/github-workflows/resolve-pr-from-run@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        with:
          run-id: ${{ github.event.workflow_run.id }}
          workflow-path: .github/workflows/news-label-source.yml
      - if: steps.pr.outputs.bot-author == 'true'
        uses: tox-dev/github-workflows/label-bot-news@9a4e76e2f4901856f2784f6c0efc89278c518b1f
        with:
          pull-request: ${{ steps.pr.outputs.number }}
          bot-author: "true"
          fragments: .changeset
          fragment-style: changeset
