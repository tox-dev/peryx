name: Set up Rust tools
description: Install the repository toolchain and selected mise tools
inputs:
  tools:
    description: Tools passed to mise install
    required: true
  toolchain:
    description: Rust toolchain override
    required: false
    default: ""
  components:
    description: Additional Rust components
    required: false
    default: ""
  targets:
    description: Additional Rust targets
    required: false
    default: ""
  cache-targets:
    description: Cache Cargo target directories
    required: false
    default: "true"
  cache-save:
    description: Whether this run writes the tool and Cargo caches
    required: false
    default: ${{ github.ref == 'refs/heads/main' }}
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        target: ${{ inputs.targets }}
        cache: false
        # v2 moved its `-D warnings` default from RUSTFLAGS to cargo's build.warnings, which also fails
        # the build on cargo's own lints, such as the unused_dependencies lint nightly cargo reports.
        rustflags: -D warnings
        build-warnings: ""
    # rust-cache hashes every installed toolchain into its key, so the stable toolchain the runner image
    # ships rotates every cache in the repository each time the image updates, and the old entries stay
    # behind until the 10 GB limit evicts them. Only the pinned toolchain is left to hash.
    - shell: bash
      run: |
        active=$(rustup show active-toolchain | cut -d' ' -f1)
        rustup default "$active"
        rustup toolchain list --quiet | while read -r toolchain; do
          if [[ $toolchain != "$active" ]]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.14
        # sccache is a configured install dependency of every cargo: tool, so mise refuses to build
        # one from source until sccache itself is installed.
        install_args: --locked sccache ${{ inputs.tools }}
        cache_save: ${{ inputs.cache-save }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      env:
        NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
      with:
        cache-targets: ${{ inputs.cache-targets }}
        save-if: ${{ inputs.cache-save }}
