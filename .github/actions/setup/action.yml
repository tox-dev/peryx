name: Set up Rust tools
description: Install the repository toolchain and selected mise tools
inputs:
  tools:
    description: Tools passed to mise install
    required: true
  toolchain:
    description: Rust toolchain override
    required: false
    default: ""
  components:
    description: Additional Rust components
    required: false
    default: ""
  targets:
    description: Additional Rust targets
    required: false
    default: ""
  cache-targets:
    description: Cache Cargo target directories
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        target: ${{ inputs.targets }}
        cache: false
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        version: 2026.8.14
        # sccache is a configured install dependency of every cargo: tool, so mise refuses to build
        # one from source until sccache itself is installed.
        install_args: --locked sccache ${{ inputs.tools }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      env:
        NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
      with:
        cache-targets: ${{ inputs.cache-targets }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
