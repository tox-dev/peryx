version: 2
updates:
  - package-ecosystem: pre-commit
    directory: /
    labels:
      - dependencies
      - skip news
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: "/"
    # Exact pins in Cargo.toml; the comment beside each says why moving it needs its own change.
    ignore:
      - dependency-name: "minicov"
      - dependency-name: "unicode-normalization"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      cargo:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/site"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
      - dependency-name: "puppeteer"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/crates/peryx-web/tests/frontend"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/crates/peryx-ecosystem-pypi/tests/frontend"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/crates/peryx-ecosystem-oci/tests/frontend"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
