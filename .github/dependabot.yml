version: 2
updates:
  - package-ecosystem: pre-commit
    directory: /
    labels:
      - dependencies
      - skip news
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: "/"
    # Cargo.toml documents why these versions are held.
    ignore:
      - dependency-name: "minicov"
      # Moka and Tokio still need 0.12; the workspace rejects duplicate lock crates.
      - dependency-name: "parking_lot"
      - dependency-name: "unicode-normalization"
      # Sigstore still needs the 0.2 ASN.1 stack; the workspace rejects duplicates.
      - dependency-name: "x509-cert"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      cargo:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/site"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
      - dependency-name: "puppeteer"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/crates/peryx-web/tests/frontend"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/crates/peryx-ecosystem-pypi/tests/frontend"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/crates/peryx-ecosystem-oci/tests/frontend"
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "puppeteer-core"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies
      - skip news
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
