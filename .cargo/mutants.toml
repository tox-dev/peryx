# What mutation testing is asked here, and where the question stops making sense.
#
# A surviving mutant means the code could behave another way and no test would notice. That marks a
# gap where the behaviour is a promise to somebody. Production code promises behaviour to the people
# running peryx, so a survivor there is a missing test. The paths below promise nothing to anybody
# outside this repository, so a survivor is noise that each nightly reports again.
exclude_globs = [
  # Benchmark workloads build load for CodSpeed to measure. A mutant that changes how many projects a
  # workload builds moves what the benchmark measures rather than whether anything is correct, and no
  # test could assert against it.
  "crates/*/src/bench/**",

  # Tests use the shared harness, so any behaviour change in it either breaks a test that depends on
  # it, which the suite reports, or reaches nothing, which `-D dead_code` reports. Both answers land
  # before mutation asks the question. The inventory agrees, with no mutant in this crate surviving a
  # run. Add a path back if that stops holding, and say here why.
  "crates/peryx-test-support/**",

  # Fixture binaries the integration suites drive, such as the S3 multipart fixture. They hold up
  # assertions that live elsewhere, and a mutant in one fails the suite that runs it.
  "crates/*/tests/**",

]

# A mutant no build the run makes can contain is a second kind of noise. `cargo mutants` does not
# evaluate `cfg`, so it proposes mutants in code the nightly's native, all-features Linux build
# compiles out, and no test there could catch them. Each pattern below names functions whose body
# needs something that build lacks, and nothing else: whole files stay in scope, because the same
# files hold logic the suite does pin. A function belongs here only if it cannot run natively. Pure
# logic that merely sits behind such a gate gets `any(test, ...)` on the gate and a test instead.
exclude_re = [
  # Browser-only halves of the web loaders: `gloo_net` requests and the status handling written
  # inline around them, the `EventSource` topology stream, the clipboard, and the DOM event
  # handlers and tasks that start those requests. `just frontend-test` drives these in a real browser.
  'peryx-web/src/data/.*(replace|in) (fetch_json_required|fetch_json_optional|admin_request|load_analytics|load_trash|load_policy_decisions|subscribe_topology)\b',
  'peryx-web/src/data/.*delete match arm .* in (load_search|load_placements|load_operations|load_blob_placement)$',
  'peryx-web/src/data/topology\.rs.*Drop for TopologyStream',
  'peryx-web/src/pages/.*(replace|in) (submit|run_action|load_analytics|copy_to_clipboard|start_refresh|watch_topology|close_topology_stream|BrowseDocument)\b',

  # The only mutant either `reactive_value` twin gets is `Default::default()` for an `S::Value` with
  # no `Default` bound, which cannot compile. The `ssr` twin reports unviable; the other is never
  # type-checked in this build, so it would read as missed.
  'peryx-web/src/pages/mod\.rs.*replace reactive_value -> S::Value with Default::default\(\)',

  # Exports the wasm coverage counters, and exists only in the `wasm32` coverage build.
  'peryx-web/src/lib\.rs.*replace capture_coverage ',

  # Runs the macOS `sysctl` binary. Its parsing lives in `sysctl_with`, which takes the runner as an
  # argument and is pinned on every platform; the macOS CI job covers the call itself.
  'peryx-bench-core/src/machine\.rs.*replace sysctl -> ',
]
