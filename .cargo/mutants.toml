# What mutation testing is asked here, and where the question stops making sense.
#
# A surviving mutant means the code could behave another way and no test would notice. That marks a
# gap where the behaviour is a promise to somebody. Production code promises behaviour to the people
# running peryx, so a survivor there is a missing test. The paths below promise nothing to anybody
# outside this repository, so a survivor is noise that each nightly reports again.
exclude_globs = [
  # Benchmark workloads build load for CodSpeed to measure. A mutant that changes how many projects a
  # workload builds moves what the benchmark measures rather than whether anything is correct, and no
  # test could assert against it.
  "crates/*/src/bench/**",

  # Tests use the shared harness, so any behaviour change in it either breaks a test that depends on
  # it, which the suite reports, or reaches nothing, which `-D dead_code` reports. Both answers land
  # before mutation asks the question. The inventory agrees, with no mutant in this crate surviving a
  # run. Add a path back if that stops holding, and say here why.
  "crates/peryx-test-support/**",

  # Fixture binaries the integration suites drive, such as the S3 multipart fixture. They hold up
  # assertions that live elsewhere, and a mutant in one fails the suite that runs it.
  "crates/*/tests/**",

  # These loader modules split each function in two: an `ssr` half that reads `AppState` directly, and
  # a `not(ssr), hydrate` half that fetches the same data over the network from a running browser. This
  # workspace's own mutation run enables every feature at once, so `not(ssr)` never holds and the
  # browser half never compiles into the binary a mutant lands in; no test here could reach it. The
  # browser half is what `just frontend-test`'s Playwright suite drives against the compiled WASM
  # bundle, a separate pipeline `cargo mutants` never runs. Excluding the whole file also stops asking
  # about its `ssr` half, which is unrelated but not cheaply separable at this granularity; say why here
  # if this needs to be finer, and add the file back if its balance changes.
  "crates/peryx-web/src/data/browse.rs",
  "crates/peryx-web/src/data/operations.rs",
  "crates/peryx-web/src/data/placement.rs",
  "crates/peryx-web/src/data/search.rs",
  "crates/peryx-web/src/data/stats.rs",
  "crates/peryx-web/src/data/status.rs",
  "crates/peryx-web/src/data/topology.rs",
]
