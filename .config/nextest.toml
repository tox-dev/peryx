[profile.ci]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"
leak-timeout = { period = "1s", result = "fail" }
slow-timeout = { period = "90s", terminate-after = 2 }
status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

[profile.mutation]
inherits = "ci"
fail-fast = true
# cargo-mutants has one signal: it reads "the suite failed under this mutant" as "the mutant was
# caught". A leak verdict says nothing about whether the mutation changed any behaviour, so letting
# one fail the suite records a surviving mutant as dead, and no output tells that apart from a real
# kill. The period stays where `ci` sets it, because a rarer false catch is harder to notice rather
# than better. `ci` keeps `result = "fail"`: a leak in the ordinary test job is worth surfacing.
leak-timeout = { period = "1s", result = "pass" }

[test-groups]
containers = { max-threads = 1 }
e2e-servers = { max-threads = 4 }
# The bench server tests each take a localhost port and start a process on it. They pick the port by
# binding it, reading what the kernel assigned and releasing it again, so two of them running at once
# can be handed the same port. One at a time removes that.
bench-servers = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/(^|::)test_.*_container_/)"
test-group = "containers"

[[profile.default.overrides]]
filter = "binary_id(peryx-pypi-system-tests::e2e)"
test-group = "e2e-servers"

[[profile.default.overrides]]
filter = "test(/^bench::tests::.*_server_/)"
test-group = "bench-servers"
