{% component brandMotion() %}
<div class="brand-motion">
  <div class="brand-stoop run" id="brand-stoop" role="button" tabindex="0" aria-label="Replay the stoop animation">
    <div class="brand-streaks" aria-hidden="true">
      <span class="brand-streak"></span><span class="brand-streak"></span><span class="brand-streak"></span>
      <span class="brand-streak"></span><span class="brand-streak"></span>
    </div>
    {{<falcon group="brand-dive" label="peryx mark, diving" />}}
    <span class="brand-stoop-hint">click to replay</span>
  </div>
  <div class="brand-motion-side">
    <div class="brand-loader">
      {{<falcon group="brand-loop" />}}
      <span class="brand-loader-cap">loading · the stoop, looped</span>
    </div>
    <div>
      <div class="brand-progress-row"><span>mirror sync</span><span>determinate</span></div>
      <div class="brand-prog brand-prog-det"><span></span></div>
    </div>
    <div>
      <div class="brand-progress-row"><span>indexing</span><span>indeterminate</span></div>
      <div class="brand-prog brand-prog-indet"><span></span></div>
    </div>
  </div>
</div>
<script>
  (function () {
    var tile = document.getElementById("brand-stoop");
    function replay() {
      tile.classList.remove("run");
      void tile.offsetWidth;
      tile.classList.add("run");
    }
    tile.addEventListener("click", replay);
    tile.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        replay();
      }
    });
  })();
</script>
{% endcomponent brandMotion %}
