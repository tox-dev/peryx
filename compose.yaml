name: peryx-test

x-test-environment: &test-environment
  CARGO_HOME: /cargo
  CARGO_TARGET_DIR: /target
  PERYX_COVERAGE_TARGET_DIR: /target/coverage
  CLANG: clang-22
  HOME: /workspace/.tox/docker/home
  XDG_CACHE_HOME: /workspace/.tox/docker/cache
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  TMPDIR: /workspace/.tox/tmp
  TMP: /workspace/.tox/tmp
  TEMP: /workspace/.tox/tmp
  PERYX_TEST_TMPDIR: /workspace/.tox/tmp

x-test-service: &test-service
  cap_drop: ["DAC_OVERRIDE", "DAC_READ_SEARCH"]
  build:
    context: scripts/ci
    dockerfile: Dockerfile
  init: true
  mem_limit: ${PERYX_TEST_MEMORY:-8g}
  user: "${PERYX_UID:-1000}:${PERYX_GID:-1000}"
  working_dir: /workspace
  environment: *test-environment
  volumes:
    - ${PWD:-.}:/workspace
    - ${PWD:-.}/.tox/docker/cargo:/cargo
    - ${PWD:-.}/.tox/docker/target:/target
  entrypoint: ["just"]

services:
  codspeed:
    profiles: ["codspeed"]
    image: ${PERYX_CODSPEED_IMAGE:-peryx-codspeed:local}
    platform: linux/arm64
    build:
      context: .
      dockerfile: .github/codspeed/Dockerfile
    security_opt: ["seccomp=unconfined"]
    working_dir: /workspace
    environment:
      CARGO_HOME: /workspace/.tox/codspeed/cargo
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_TARGET_DIR: /workspace/.tox/codspeed/target
      CODSPEED_BUILD_ONLY:
      CODSPEED_FORCE_REBUILD:
      CODSPEED_SKIP_UPLOAD: ${CODSPEED_SKIP_UPLOAD:-true}
      CODSPEED_SOURCE_KEY:
      CODSPEED_TOKEN:
      GH_MATRIX:
      GH_STRATEGY:
      GITHUB_ACTIONS:
      GITHUB_ACTOR:
      GITHUB_API_URL:
      GITHUB_BASE_REF:
      GITHUB_EVENT_NAME:
      GITHUB_EVENT_PATH: /github-event.json
      GITHUB_HEAD_REF:
      GITHUB_JOB:
      GITHUB_REF:
      GITHUB_REPOSITORY:
      GITHUB_REPOSITORY_OWNER:
      GITHUB_RUN_ATTEMPT:
      GITHUB_RUN_ID:
      GITHUB_SERVER_URL:
      GITHUB_SHA:
      GITHUB_WORKFLOW:
      GITHUB_WORKFLOW_REF:
      GITHUB_WORKFLOW_SHA:
      GLIBC_TUNABLES: glibc.cpu.name=generic:glibc.malloc.arena_max=1
    volumes:
      - ${PWD:-.}:/workspace
      - ${PERYX_CODSPEED_EVENT_PATH:-/dev/null}:/github-event.json:ro
    entrypoint: ["ci/run-codspeed.sh"]

  test:
    <<: *test-service
    profiles: ["test", "analysis"]

  test-16g:
    <<: *test-service
    profiles: ["16g"]
    mem_limit: 16g

  docker:
    profiles: ["system", "system-16g"]
    image: docker:29-dind
    privileged: true
    mem_limit: ${PERYX_DOCKER_MEMORY:-2g}
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ${PWD:-.}/.tox/docker/data:/var/lib/docker

  system:
    <<: *test-service
    profiles: ["system"]
    mem_limit: 6g
    depends_on:
      docker:
        condition: service_healthy
    network_mode: "service:docker"
    environment:
      <<: *test-environment
      DOCKER_HOST: tcp://127.0.0.1:2375

  system-16g:
    <<: *test-service
    profiles: ["system-16g"]
    mem_limit: 12g
    depends_on:
      docker:
        condition: service_healthy
    network_mode: "service:docker"
    environment:
      <<: *test-environment
      DOCKER_HOST: tcp://127.0.0.1:2375
