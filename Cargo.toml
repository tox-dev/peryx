[workspace]
resolver = "3"
members = [
  "crates/*",
  "crates/peryx-ecosystem-oci/tests/system-suite",
  "crates/peryx-ecosystem-pypi/tests/system-suite",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/tox-dev/peryx"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(loom)'] }
dead_code = "deny"
unused_variables = "warn"
unused_imports = "warn"

[workspace.dependencies]
peryx-archive = { version = "0.0.1", path = "crates/peryx-archive" }
peryx-core = { version = "0.0.1", path = "crates/peryx-core" }
peryx-driver = { version = "0.0.1", path = "crates/peryx-driver" }
peryx-events = { version = "0.0.1", path = "crates/peryx-events" }
peryx-bench-core = { version = "0.0.1", path = "crates/peryx-bench-core" }
peryx-bench = { version = "0.0.1", path = "crates/peryx-bench" }
peryx-index = { version = "0.0.1", path = "crates/peryx-index" }
peryx-search = { version = "0.0.1", path = "crates/peryx-search" }
peryx-ecosystem-pypi = { version = "0.0.1", path = "crates/peryx-ecosystem-pypi" }
peryx-ecosystem-oci = { version = "0.0.1", path = "crates/peryx-ecosystem-oci" }
peryx-policy = { version = "0.0.1", path = "crates/peryx-policy" }
peryx-pql = { version = "0.0.1", path = "crates/peryx-pql" }
peryx-identity = { version = "0.0.1", path = "crates/peryx-identity" }
peryx-plugin-registry = { version = "0.0.1", path = "crates/peryx-plugin-registry" }
peryx-ha = { version = "0.0.1", path = "crates/peryx-ha" }
peryx-ha-distributed = { version = "0.0.1", path = "crates/peryx-ha-distributed" }
peryx-storage = { version = "0.0.1", path = "crates/peryx-storage" }
peryx-upstream = { version = "0.0.1", path = "crates/peryx-upstream" }
peryx-http = { version = "0.0.1", path = "crates/peryx-http" }
peryx-web = { version = "0.0.1", path = "crates/peryx-web" }
peryx-test-support = { version = "0.0.1", path = "crates/peryx-test-support" }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
ipnet = { version = "2.12", features = ["serde"] }
sha2 = "0.11"
blake2 = "0.10"
md-5 = "0.11"
csv = "1"
dashmap = "6.2"
tempfile = "3"
atomicwrites = "0.4"
testcontainers = { version = "0.27", features = ["http_wait"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["minio", "ring"] }
mimalloc = "0.1"
redb = "4.1"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tokio = "1"
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "axum", "tls12", "webpki-roots"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["test-util"] }
bytes = "1"
httpdate = "1"
futures-core = "0.3"
futures-util = "0.3"
fs4 = "0.13"
getrandom = "0.4"
moka = { version = "0.12", features = ["sync"] }
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
hex = "0.4"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
url = "2"
wiremock = "0.6"
rstest = "0.26"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
tantivy = "0.26"
toml = "1.1"
insta = "1"
thiserror = "2.0"
async-trait = "0.1"
bb8-ldap = { version = "0.4.1", default-features = false, features = ["tls-rustls-ring"] }
arc-swap = "1.7"
command-group = { version = "5.0.1", features = ["with-tokio"] }
anyhow = "1.0"
tracing = "0.1"
sysinfo = "0.39"
utoipa = "5.5"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"
minicov = "0.3"
rustls-native-certs = "0.8"
rustix = { version = "1", features = ["process"] }
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
gloo-net = "0.7"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "DomStringMap", "Navigator", "Clipboard", "MediaQueryList", "Storage"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
percent-encoding = "2"
criterion = { package = "codspeed-criterion-compat", version = "5.0", default-features = false }
stats_alloc = "0.1.10"
statrs = "0.18"
hdrhistogram = { version = "7.5", default-features = false }
uv-netrc = "0.0.62"

[patch.crates-io]
# https://github.com/GnomedDev/proc-macro-error-2/pull/14 fixes Rust 1.96 future incompatibility.
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }

[profile.release]
strip = true
lto = "fat"

# OpenRaft 0.9.25's `debug_assert!(self.leader.is_none())` rejects a valid leader-to-follower
# transition after a higher term, so disable that dependency's debug assertions.
[profile.dev.package.openraft]
debug-assertions = false

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.peryx-ci.coverage-inputs]
peryx-web = ["crates/peryx-web/tests/frontend"]

# cargo-leptos hydrates the WASM library while the binary uses peryx-web's SSR default.
[[workspace.metadata.leptos]]
name = "peryx"
bin-package = "peryx"
bin-target = "peryx"
bin-features = ["composition-oci", "composition-pypi"]
lib-package = "peryx-web"
lib-features = ["hydrate"]
lib-default-features = false
output-name = "peryx_web"
site-root = ".tox/frontend/ui"
site-pkg-dir = "pkg"
