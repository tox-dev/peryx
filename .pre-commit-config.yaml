default_language_version:
  python: python3.15
ci:
  autoupdate_schedule: monthly
  # GitHub Actions runs the Rust hooks with the repository toolchain.
  skip: [cargo-fmt, cargo-clippy]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --check --
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --target-dir .tox/pre-commit-target --workspace --all-targets --all-features -- -D warnings
        types: [rust]
        pass_filenames: false
      - id: docs-no-credential-argv
        name: documentation credentials stay out of argv
        language: pygrep
        entry: '(?m)^(?:\s*(?:\$\s*)?(?:(?:docker|podman)\s+login|crane\s+auth\s+login|twine\s+upload|uv\s+(?:auth\s+login|publish))\b[^\n]*[ \t](?:-p|--password)(?:[= \t]|$)|\s+(?:-u|--username)(?:[= \t])\S+[ \t]+(?:-p|--password)(?:[= \t]|$))'
        types: [markdown]
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547  # frozen: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-gfm-alerts==2.1.0
          - mdformat-footnote==0.1.3
          - mdformat-deflist==0.1.4
          - mdformat-simple-breaks==0.1.0
          - mdformat-toc==0.5.0
          - mdformat-config==0.2.1
          - mdformat-web==0.2.0
          - mdformat-rustfmt==0.0.3
          - mdformat-zola==1.0.1
          - mdformat-ruff==0.1.3
          - ruff==0.17.1
        args: ["--wrap", "120"]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        exclude: (^site/static/diagrams/|\.b64$)
        args:
          - --ignore-words-list=ser,unparseable,atleast,wronly,fpr
          - --ignore-words=site/.codespell-ignore-words.txt
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
