ci:
  autoupdate_schedule: monthly
  # GitHub Actions runs hooks that need Rust or Node.
  skip: [cargo-fmt, cargo-clippy, render-diagrams]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --check --
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --target-dir .tox/pre-commit-target --workspace --all-targets --all-features -- -D warnings
        types: [rust]
        pass_filenames: false
      - id: test-layout
        name: test layout
        language: system
        entry: .github/scripts/check-test-layout
        types: [rust]
        pass_filenames: false
      - id: test-timing
        name: test timing
        language: system
        entry: .github/scripts/check-test-timing
        files: \.(bash|cjs|js|jsx|mjs|rs|sh|ts|tsx|zsh)$
        pass_filenames: false
      - id: render-diagrams
        name: check mermaid diagrams
        language: system
        entry: node site/scripts/render_diagrams.mjs --check
        files: ^(site/content|crates/peryx-ecosystem-(pypi|oci)/docs/content)/.*\.md$
        pass_filenames: false
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm>=1
          - mdformat-gfm-alerts>=2
          - mdformat-footnote>=0.1.3
          - mdformat-deflist>=0.1.4
          - mdformat-simple-breaks>=0.1
          - mdformat-toc>=0.5
          - mdformat-config>=0.2.1
          - mdformat-web>=0.2
          - mdformat-rustfmt>=0.0.3
          - mdformat-zola>=1
          - mdformat-ruff>=0.1.3
          - ruff>=0.16.2
        args: ["--wrap", "120"]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^site/diagrams/
        args:
          - --ignore-words-list=ser,unparseable,atleast,wronly
          - --ignore-words=crates/peryx-ecosystem-pypi/docs/.codespell-ignore-words.txt
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
