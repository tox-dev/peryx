default_language_version:
  python: python3.15
ci:
  autoupdate_schedule: weekly
  # GitHub Actions runs the Rust hooks with the repository toolchain.
  skip: [cargo-fmt, cargo-clippy]
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --check --
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --target-dir .tox/pre-commit-target --workspace --all-targets --all-features -- -D warnings
        types: [rust]
        pass_filenames: false
      - id: docs-no-credential-argv
        name: documentation credentials stay out of argv
        language: pygrep
        entry: '(?m)^(?:\s*(?:\$\s*)?(?:(?:docker|podman)\s+login|crane\s+auth\s+login|twine\s+upload|uv\s+(?:auth\s+login|publish))\b[^\n]*[ \t](?:-p|--password)(?:[= \t]|$)|\s+(?:-u|--username)(?:[= \t])\S+[ \t]+(?:-p|--password)(?:[= \t]|$))'
        types: [markdown]
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-gfm-alerts==2.1.0
          - mdformat-footnote==0.1.3
          - mdformat-deflist==0.1.4
          - mdformat-simple-breaks==0.1.0
          - mdformat-toc==0.5.0
          - mdformat-config==0.2.1
          - mdformat-web==0.2.0
          - mdformat-rustfmt==0.0.3
          - mdformat-zola==1.0.0
          - mdformat-ruff==0.1.3
          - ruff==0.17.1
          - "beautifulsoup4==4.15.0" # release-creator managed
          - "cssbeautifier==2.0.3" # release-creator managed
          - "editorconfig==0.17.1" # release-creator managed
          - "jsbeautifier==2.0.3" # release-creator managed
          - "markdown-it-py==4.2.0" # release-creator managed
          - "mdformat-front-matters==2.0.0" # release-creator managed
          - "mdformat-pyproject==0.1.1" # release-creator managed
          - "mdformat-shfmt==0.2.0" # release-creator managed
          - "mdit-py-plugins==0.6.1" # release-creator managed
          - "mdurl==0.1.2" # release-creator managed
          - "ruamel-yaml==0.19.1" # release-creator managed
          - "soupsieve==3.0.3" # release-creator managed
          - "taplo==0.9.3" # release-creator managed
          - "toml==0.10.2" # release-creator managed
          - "typing-extensions==4.16.0" # release-creator managed
          - "wcwidth==0.9.2" # release-creator managed
        args: ["--wrap", "120"]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
        additional_dependencies:
          - "attrs==26.1.0" # release-creator managed
          - "certifi==2026.7.22" # release-creator managed
          - "charset-normalizer==3.5.2" # release-creator managed
          - "click==8.5.0" # release-creator managed
          - "idna==3.20" # release-creator managed
          - "jsonschema==4.26.0" # release-creator managed
          - "jsonschema-specifications==2025.9.1" # release-creator managed
          - "referencing==0.37.0" # release-creator managed
          - "regress==2026.9.1" # release-creator managed
          - "requests==2.34.2" # release-creator managed
          - "rpds-py==2026.9.1" # release-creator managed
          - "ruamel-yaml==0.19.1" # release-creator managed
          - "urllib3==2.8.0" # release-creator managed
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        exclude: (^site/static/diagrams/|\.b64$)
        args:
          - --ignore-words-list=ser,unparseable,atleast,wronly,fpr
          - --ignore-words=site/.codespell-ignore-words.txt
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        additional_dependencies:
          - "zizmor==1.31.1" # release-creator managed
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
      - id: trailing-whitespace
        additional_dependencies:
          - "ruamel-yaml==0.19.1" # release-creator managed
