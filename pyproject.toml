[build-system]
build-backend = "maturin"
requires = [ "maturin<2,>=1.14.1" ]

[project]
name = "peryx"
description = "Multi-ecosystem artifact cache and private registry"
readme = "README.md"
keywords = [ "artifact-registry", "cache", "mirror", "oci", "pypi", "software-distribution" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dynamic = [ "version" ]
urls.Changelog = "https://github.com/tox-dev/peryx/blob/main/CHANGELOG.md"
urls.Documentation = "https://peryx.readthedocs.io/"
urls.Issues = "https://github.com/tox-dev/peryx/issues"
urls.Homepage = "https://github.com/tox-dev/peryx"
urls.Source = "https://github.com/tox-dev/peryx"

[dependency-groups]
lock-tools = [ "nab==0.0.22" ]
package-check = [
  "check-wheel-contents>=0.6.3",
  "twine>=7",
]
release = [
  "prek>=0.5",
  "release-creator>=0.6.0",
]
release-check = [
  "prek>=0.5",
]

release-notes = [
  "release-creator>=0.6.0",
]

release-news = [
  "release-creator>=0.6.0",
]

release-prepare = [
  "prek>=0.5",
  "release-creator>=0.6.0",
]

release-validate = [
  "prek>=0.5",
  "release-creator>=0.6.0",
]


[tool.uv.dependency-groups]
release = { requires-python = ">=3.15" }
release-check = { requires-python = ">=3.15" }
release-notes = { requires-python = ">=3.15" }
release-news = { requires-python = ">=3.15" }
release-prepare = { requires-python = ">=3.15" }
release-validate = { requires-python = ">=3.15" }

[tool.maturin]
include = [
  { path = "site/content/ecosystems/oci/reference/policy.md", format = "sdist" },
  { path = "site/static/*.svg", format = "sdist" },
]
# The wheel carries the compiled `peryx` binary as a console script; there are no Python
# bindings, so one wheel per platform serves every CPython and PyPy version.
bindings = "bin"
manifest-path = "crates/peryx/Cargo.toml"

[tool.nab]
mode = "universal"
base-group = "project-runtime"
build-group = "build"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"

[tool.nab.matrix]
python = ">=3.15,<3.16"
platforms = [ "linux_x86_64", "linux_aarch64", "macos_arm64", "windows_amd64" ]

[[tool.nab.package-rules]]
match = [ "nab", "nab-index", "nab-markersets", "nab-project", "nab-provider", "nab-resolver" ]
uploaded-prior-to = "2026-10-19T00:00:00Z"

[tool.nab.packages.release-creator]
uploaded-prior-to = "2026-10-23T02:44:40Z"
