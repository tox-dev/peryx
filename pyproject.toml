[build-system]
build-backend = "maturin"
requires = [ "maturin<2,>=1.14.1" ]

[project]
name = "peryx"
description = "Multi-ecosystem artifact cache and private registry"
readme = "README.md"
keywords = [ "artifact-registry", "cache", "mirror", "oci", "pypi", "software-distribution" ]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dynamic = [ "version" ]
urls.Documentation = "https://peryx.readthedocs.io/"
urls.Issues = "https://github.com/tox-dev/peryx/issues"
urls.Source = "https://github.com/tox-dev/peryx"

[tool.maturin]
# The wheel carries the compiled `peryx` binary as a console script; there are no Python
# bindings, so one wheel per platform serves every CPython and PyPy version.
bindings = "bin"
manifest-path = "crates/peryx/Cargo.toml"
