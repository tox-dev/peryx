[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Leptos 0.8 and Simba 0.9 depend on paste." },
]
unused-ignored-advisory = "deny"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "zlib-acknowledgement",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
  { crate = "base64@0.22.1", reason = "Axum 0.8, Leptos 0.8, and current AWS crates require base64 0.22." },
  { crate = "block-buffer@0.10.4", reason = "digest 0.10 requires block-buffer 0.10." },
  { crate = "convert_case@0.6.0", reason = "config 0.15.25 requires convert_case 0.6." },
  { crate = "cpufeatures@0.2.17", reason = "sha1 0.10 and sha2 0.10 require cpufeatures 0.2." },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10 requires crypto-common 0.1." },
  { crate = "digest@0.10.7", reason = "blake2 0.10 and AWS checksum crates require digest 0.10." },
  { crate = "fs4@0.13.1", reason = "Tantivy 0.26 requires fs4 0.13." },
  { crate = "getrandom@0.2.17", reason = "ring 0.17 and rand_core 0.6 require getrandom 0.2." },
  { crate = "getrandom@0.3.4", reason = "rand_core 0.9 requires getrandom 0.3." },
  { crate = "gloo-net@0.6.0", reason = "Leptos 0.8 requires gloo-net 0.6." },
  { crate = "gloo-utils@0.2.0", reason = "gloo-net 0.6 requires gloo-utils 0.2." },
  { crate = "hashbrown@0.14.5", reason = "DashMap 6.2 requires hashbrown 0.14." },
  { crate = "hashbrown@0.16.1", reason = "lru 0.16 requires hashbrown 0.16." },
  { crate = "http@0.2.12", reason = "AWS SDK 1.x retains its HTTP 0.2 compatibility layer." },
  { crate = "http-body@0.4.6", reason = "AWS SDK 1.x retains its HTTP body 0.4 compatibility layer." },
  { crate = "io-lifetimes@2.0.4", reason = "cap-primitives 4.0.3 requires fs-set-times 0.20, which retains io-lifetimes 2." },
  { crate = "itertools@0.13.0", reason = "pep508_rs 0.9 requires itertools 0.13." },
  { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 requires linux-raw-sys 0.4." },
  { crate = "lru@0.16.4", reason = "Tantivy 0.26 requires lru 0.16." },
  { crate = "nix@0.27.1", reason = "command-group 5.0.1 requires nix 0.27." },
  { crate = "nix@0.30.1", reason = "homedir 0.3 requires nix 0.30." },
  { crate = "prettyplease@0.2.37", reason = "Leptos 0.8 requires prettyplease 0.2." },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3 requires r-efi 5." },
  { crate = "rand@0.8.8", reason = "OpenRaft 0.9 requires rand 0.8." },
  { crate = "rand@0.9.5", reason = "Leptos 0.8 requires rand 0.9." },
  { crate = "rand_chacha@0.3.1", reason = "rand 0.8 requires rand_chacha 0.3." },
  { crate = "rand_core@0.6.4", reason = "rand 0.8 and password-hash 0.5 require rand_core 0.6." },
  { crate = "rand_core@0.9.5", reason = "rand 0.9 requires rand_core 0.9." },
  { crate = "rustix@0.38.44", reason = "atomicwrites 0.4 requires rustix 0.38." },
  { crate = "sha1@0.10.7", reason = "AWS SDK 1.x, Axum 0.8, and Tungstenite 0.29 require sha1 0.10." },
  { crate = "sha2@0.10.9", reason = "wasm_split_macros 0.2 requires sha2 0.10." },
  { crate = "spin@0.9.9", reason = "multer 3.1 requires spin 0.9." },
  { crate = "syn@2.0.119", reason = "Leptos 0.8 and current proc-macro dependencies require syn 2." },
  { crate = "thiserror@1.0.69", reason = "OpenRaft 0.9, Leptos 0.8, and pep508_rs 0.9 require thiserror 1." },
  { crate = "thiserror-impl@1.0.69", reason = "thiserror 1 requires thiserror-impl 1." },
  { crate = "tower-http@0.6.11", reason = "Leptos Axum 0.8 requires tower-http 0.6." },
  { crate = "unicode-width@0.1.14", reason = "miette 7.6 requires unicode-width 0.1." },
  { crate = "untrusted@0.7.1", reason = "aws-lc-rs 1.18 requires untrusted 0.7." },
  { crate = "webpki-roots@0.26.11", reason = "async-web-client 0.6 requires webpki-roots 0.26." },
  { crate = "windows@0.61.3", reason = "homedir 0.3 requires windows 0.61." },
  { crate = "windows-collections@0.2.0", reason = "windows 0.61 requires windows-collections 0.2." },
  { crate = "windows-core@0.61.2", reason = "windows 0.61 requires windows-core 0.61." },
  { crate = "windows-future@0.2.1", reason = "windows 0.61 requires windows-future 0.2." },
  { crate = "windows-link@0.1.3", reason = "windows 0.61 requires windows-link 0.1." },
  { crate = "windows-numerics@0.2.0", reason = "windows 0.61 requires windows-numerics 0.2." },
  { crate = "windows-result@0.3.4", reason = "windows-core 0.61 requires windows-result 0.3." },
  { crate = "windows-strings@0.4.2", reason = "windows-core 0.61 requires windows-strings 0.4." },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17, atomicwrites 0.4, and self-replace 1.5 require windows-sys 0.52." },
  { crate = "windows-sys@0.59.0", reason = "fs4 0.13 and rustix 0.38 require windows-sys 0.59." },
  { crate = "windows-threading@0.1.0", reason = "windows-future 0.2 requires windows-threading 0.1." },
  { crate = "xml-rs@0.8.29", reason = "rst_renderer 0.4 requires xml-rs 0.8." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/fgardt/proc-macro-error-2"]
