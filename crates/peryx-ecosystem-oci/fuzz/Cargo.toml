[package]
name = "peryx-ecosystem-oci-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/tox-dev/peryx"

[package.metadata]
cargo-fuzz = true

[dependencies]
axum = "0.8.9"
libfuzzer-sys = "0.4"
peryx-driver = { version = "2026.1105.0", path = "../../peryx-driver" }
peryx-ecosystem-oci = { version = "2026.1105.0", path = ".." }
peryx-identity = { version = "2026.1105.0", path = "../../peryx-identity" }
peryx-index = { version = "2026.1105.0", path = "../../peryx-index" }
peryx-policy = { version = "2026.1105.0", path = "../../peryx-policy" }
peryx-plugin-registry = { version = "2026.1105.0", path = "../../peryx-plugin-registry" }
peryx-storage = { version = "2026.1105.0", path = "../../peryx-storage" }
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt"] }

[[bin]]
name = "oci_reference"
path = "fuzz_targets/oci_reference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oci_manifest"
path = "fuzz_targets/oci_manifest.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(loom)'] }
dead_code = "deny"
unused_variables = "warn"
unused_imports = "warn"

[lints]
workspace = true
