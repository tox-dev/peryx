[package]
name = "peryx-ecosystem-oci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The OCI/Docker registry driver for peryx: the distribution-spec /v2/ API over the content-addressed blob store."

[features]
default = []
bench = [
  "dep:peryx-bench",
  "dep:peryx-bench-core",
  "dep:tempfile",
  "dep:clap",
  "tokio/macros",
  "tokio/rt-multi-thread",
]

[dependencies]
peryx-core.workspace = true
peryx-bench-core = { workspace = true, optional = true }
peryx-bench = { workspace = true, optional = true }
peryx-plugin-registry.workspace = true
peryx-driver.workspace = true
peryx-events.workspace = true
peryx-ha.workspace = true
peryx-index.workspace = true
peryx-search.workspace = true
peryx-archive.workspace = true
peryx-storage.workspace = true
peryx-identity.workspace = true
peryx-policy.workspace = true
peryx-upstream.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body.workspace = true
http-body-util.workspace = true
mediatype.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["gzip", "http2", "rustls-no-provider", "stream"] }
serde = { workspace = true, features = ["derive"] }
url.workspace = true
serde_json.workspace = true
toml.workspace = true
utoipa.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }
tracing.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
peryx-events = { workspace = true, features = ["test-util"] }
peryx-http.workspace = true
peryx-storage = { workspace = true, features = ["fault-injection"] }
peryx-test-support = { workspace = true, features = ["redb-fault"] }
rustls.workspace = true
base64.workspace = true
flate2.workspace = true
tar.workspace = true
http.workspace = true
redb.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "test-util", "time"] }
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true
wiremock.workspace = true
criterion = { workspace = true, features = ["async_tokio"] }
rstest.workspace = true
stats_alloc.workspace = true

[[bin]]
name = "peryx-bench-oci"
path = "src/bin/peryx-bench-oci.rs"
required-features = ["bench"]
test = false
bench = false

[[bin]]
name = "peryx-oci-bench-process-fixture"
path = "tests/fixtures/bench.rs"
required-features = ["bench"]
test = false
bench = false
doc = false

[[bench]]
name = "version_check"
harness = false

[[bench]]
name = "manifest_by_digest"
harness = false

[[bench]]
name = "blob_store_read"
harness = false

[[bench]]
name = "tags_list"
harness = false

[lints]
workspace = true
