[package]
name = "peryx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-ecosystem artifact cache and private registry."
default-run = "peryx"

[[bin]]
name = "peryx"
path = "src/main.rs"
test = false
required-features = ["composition-oci", "composition-pypi"]

[[bin]]
name = "peryx-process-fixture"
path = "tests/fixtures/process.rs"
test = false
bench = false
doc = false
required-features = ["process-fixture"]

[[test]]
name = "process_fixture"
path = "tests/process_fixture.rs"
required-features = ["process-fixture"]

[features]
default = ["composition-oci", "composition-pypi"]
composition-oci = ["dep:peryx-ecosystem-oci"]
composition-pypi = ["dep:peryx-ecosystem-pypi"]
# Requires toxiproxy-server to inject faults into spawned processes.
availability-e2e = []
process-fixture = []
# Pull requests bound the simulator seed range; scheduled CI uses larger shards.
sim-campaign = []
system-tests = ["peryx-web/hydrate", "peryx-web/ssr"]
# Dist builds self-update; package-manager installs update through their package manager.
self-update = ["dep:axoupdater"]

[dependencies]
axoupdater = { version = "0.10", default-features = false, features = ["github_releases", "blocking"], optional = true }
peryx-core.workspace = true
peryx-driver.workspace = true
peryx-events.workspace = true
peryx-plugin-registry.workspace = true
peryx-ecosystem-oci = { workspace = true, optional = true }
peryx-ecosystem-pypi = { workspace = true, optional = true }
peryx-ha.workspace = true
peryx-identity.workspace = true
peryx-policy.workspace = true
peryx-ha-distributed.workspace = true
peryx-storage.workspace = true
peryx-upstream.workspace = true
peryx-http.workspace = true
peryx-web.workspace = true
reqwest = { workspace = true, features = ["gzip", "http2", "rustls-no-provider", "stream"] }
axum.workspace = true
axum-server.workspace = true
rustls-acme.workspace = true
rustls.workspace = true
futures-util.workspace = true
ipnet.workspace = true
mimalloc.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
utoipa.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }
syslog-tracing = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3"

[dev-dependencies]
async-trait.workspace = true
peryx-search.workspace = true
peryx-test-support.workspace = true
tokio = { workspace = true, features = ["test-util"] }
peryx-events = { workspace = true, features = ["test-util"] }
rstest.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "multipart"] }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
base64.workspace = true
redb.workspace = true
wiremock.workspace = true
rcgen = "0.14.9"
shlex.workspace = true

[lints]
workspace = true
