[package]
name = "peryx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PyPI-compatible read-through cache and private-index overlay."
default-run = "peryx"

[[bin]]
name = "peryx"
path = "src/main.rs"
test = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["e2e"]

[[test]]
name = "availability"
path = "tests/availability.rs"
required-features = ["availability-e2e"]

[[test]]
name = "sim_campaign"
path = "tests/sim_campaign.rs"
required-features = ["sim-campaign"]

[[test]]
name = "observability"
path = "tests/observability.rs"
required-features = ["availability-e2e"]

[[test]]
name = "cluster"
path = "tests/cluster.rs"
required-features = ["availability-e2e"]

[features]
# Multi-process availability harness self-tests: spawn real peryx binaries, apply Toxiproxy network
# faults, and observe them over HTTP. Off by default (they need the toxiproxy-server binary and are
# not part of the coverage gate); CI runs them in a dedicated job.
availability-e2e = []
# The availability safety-simulator seed campaign: sweeps `peryx_replication::sim` over a seed range
# and topology matrix looking for an invariant break. Off by default (not part of the coverage gate);
# CI runs a bounded set per pull request and a large sharded campaign on a schedule.
sim-campaign = []
# End-to-end tests that drive real pip/uv/twine against a spawned peryx binary. Off by default
# (they need the clients and are not part of the coverage gate); CI runs them explicitly. `e2e` is
# the fast, hermetic matrix (peryx proxies a local fixture index — no external network, no flake);
# `e2e-live` adds smoke tests against the real pypi.org.
e2e = []
e2e-live = ["e2e"]
# `peryx self update`, for binaries installed by the release installers (curl / PowerShell).
# Only the dist release builds enable it: pip- and cargo-installed copies update through their own
# package manager, mirroring how uv gates its self-update.
self-update = ["dep:axoupdater"]

[dependencies]
axoupdater = { version = "0.10", default-features = false, features = ["github_releases", "blocking"], optional = true }
peryx-core.workspace = true
peryx-driver.workspace = true
peryx-events.workspace = true
peryx-index.workspace = true
peryx-ecosystem-registry.workspace = true
peryx-ecosystem-pypi = { workspace = true, features = ["serving"] }
peryx-ecosystem-oci.workspace = true
async-trait.workspace = true
openraft.workspace = true
peryx-identity.workspace = true
peryx-policy.workspace = true
peryx-replication.workspace = true
peryx-storage.workspace = true
peryx-upstream.workspace = true
peryx-http.workspace = true
peryx-web.workspace = true
reqwest.workspace = true
axum.workspace = true
axum-server.workspace = true
rustls-acme.workspace = true
rustls.workspace = true
futures-util.workspace = true
ipnet.workspace = true
mimalloc.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
utoipa.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
syslog-tracing = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3"

[dev-dependencies]
aws-config.workspace = true
aws-sdk-s3.workspace = true
tokio = { workspace = true, features = ["test-util"] }
peryx-events = { workspace = true, features = ["test-util"] }
rstest.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "multipart"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
serde_json.workspace = true
zip.workspace = true
base64.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
redb.workspace = true
wiremock.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
rcgen = "0.13.2"

# The availability harness signals process groups through nix, a unix-only API; its callers are
# `cfg(unix)`-gated, so other platforms compile the harness without it.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs", "signal"] }

[lints]
workspace = true
