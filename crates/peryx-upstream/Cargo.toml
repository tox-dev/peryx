[package]
name = "peryx-upstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Guarded HTTP client and source router for peryx upstreams."
autotests = false

[dependencies]
reqwest = { workspace = true, features = ["gzip", "http2", "rustls-no-provider", "stream"] }
rustls.workspace = true
url.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
httpdate.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "sync", "time"] }
arc-swap.workspace = true
uv-netrc.workspace = true
command-group.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
rcgen = "0.14.9"
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
