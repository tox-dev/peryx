[package]
name = "peryx-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reactive web UI for peryx: server-side rendered, hydrated in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:peryx-driver",
    "dep:peryx-http",
    "dep:peryx-ha",
    "dep:peryx-search",
    "dep:axum",
    "dep:tower-http",
]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:gloo-net",
    "dep:base64",
    "dep:console_error_panic_hook",
    "dep:send_wrapper",
    "dep:web-sys",
]
wasm-coverage = ["hydrate", "dep:minicov"]

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }
peryx-driver = { workspace = true, optional = true }
peryx-http = { workspace = true, optional = true }
peryx-ha = { workspace = true, optional = true }
peryx-search = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["fs"] }
wasm-bindgen = { workspace = true, optional = true }
gloo-net = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
send_wrapper = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Blob",
    "EventSource",
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "ProgressEvent",
    "Window",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestUpload",
] }
base64 = { workspace = true, optional = true }
futures-util.workspace = true
peryx-core.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
minicov = { workspace = true, optional = true }

[dev-dependencies]
any_spawner = "0.3"
async-trait.workspace = true
peryx-policy.workspace = true
peryx-events.workspace = true
peryx-identity.workspace = true
peryx-test-support.workspace = true
peryx-storage.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[lints]
workspace = true
