[package]
name = "peryx-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Process harnesses shared by peryx system tests."
autotests = false

[[bin]]
name = "peryx-test-fixture"
path = "tests/fixtures/process.rs"
test = false
bench = false
doc = false

[[test]]
name = "fixture"
path = "tests/fixture.rs"

[[test]]
name = "support"
path = "tests/unit/tests.rs"

[features]
# Test-only: the deterministic redb fault injector, kept out of production builds.
redb-fault = ["dep:redb"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
peryx-core.workspace = true
peryx-driver.workspace = true
redb = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking", "gzip", "http2", "json", "rustls-no-provider", "stream"] }
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "poll", "signal"] }
unix-ancillary = "0.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
peryx-storage.workspace = true
temp-env.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
