[package]
name = "peryx-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What a peryx process reports about itself: usage counters, security event logging, and signed webhook delivery."

[features]
# Exposes the aggregator's deterministic settle barrier (`Metrics::settle`) to downstream test suites
# so they await drained state instead of polling on a timer.
test-util = []

[dependencies]
peryx-core.workspace = true
peryx-identity.workspace = true
peryx-ha.workspace = true
peryx-storage.workspace = true
futures-util.workspace = true
http.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Depend on ourselves with `test-util` so benches reach the settle barrier and the daily-snapshot seed
# the aggregator's own tests use, letting a bench pin a deterministic checkpoint at a chosen cardinality.
peryx-events = { path = ".", features = ["test-util"] }
base64.workspace = true
peryx-ha-distributed.workspace = true
criterion = { workspace = true, features = ["async_tokio"] }
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[[bench]]
name = "usage_aggregate"
harness = false

[lints]
workspace = true
