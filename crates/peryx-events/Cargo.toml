[package]
name = "peryx-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What a peryx process reports about itself: usage counters, security event logging, and signed webhook delivery."

[features]
test-util = []

[dependencies]
peryx-core.workspace = true
peryx-identity.workspace = true
peryx-ha.workspace = true
peryx-storage.workspace = true
futures-util.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["gzip", "http2", "rustls-native-certs", "rustls-no-provider", "stream"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
redb.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[[bench]]
name = "usage_aggregate"
harness = false

[lints]
workspace = true
