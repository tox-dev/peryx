<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PyPI shadow inspection</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px/1.5 sans-serif; margin: 3rem auto; max-width: 64rem; padding: 0 1rem; }
    main { min-width: 0; }
    form { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
    label { display: grid; gap: .35rem; }
    button { width: max-content; }
    table { border-collapse: collapse; min-width: 82rem; width: 100%; }
    th, td { border-bottom: 1px solid #bbb; padding: .5rem; text-align: left; vertical-align: top; }
    .table-scroll { max-width: 100%; overflow-x: auto; }
    .pagination { display: flex; gap: .75rem; margin-top: 1rem; }
    [role="alert"] { color: #a11; }
  </style>
</head>
<body>
  <main class="shadow-inspection-page">
    <h1>PyPI shadow inspection</h1>
    <form class="policy-filters">
      <label>Username<input id="shadow-user" autocomplete="username" required></label>
      <label>Password<input id="shadow-password" type="password" autocomplete="current-password" required></label>
      <label>Repository<input id="shadow-repository" required></label>
      <label>Project<input id="shadow-project" required></label>
      <button type="submit">Inspect</button>
    </form>
    <p class="policy-results" role="status" aria-live="polite">Enter credentials and a project.</p>
    <div class="table-scroll" hidden>
      <table class="shadow-inspection-table">
        <thead>
          <tr>
            <th scope="col">Outcome</th>
            <th scope="col">Decision</th>
            <th scope="col">Source</th>
            <th scope="col">Member</th>
            <th scope="col">File</th>
            <th scope="col">Digest</th>
            <th scope="col">Shadowed because</th>
            <th scope="col">Rule</th>
            <th scope="col">Reason</th>
            <th scope="col">Next eligible (UTC)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination">
      <button id="shadow-previous" type="button" disabled>Previous</button>
      <button id="shadow-next" type="button" disabled>Next</button>
    </div>
  </main>
  <script>
    'use strict';
    const form = document.querySelector('.policy-filters');
    const results = document.querySelector('.policy-results');
    const table = document.querySelector('.shadow-inspection-table');
    const tableScroll = document.querySelector('.table-scroll');
    const previousButton = document.querySelector('#shadow-previous');
    const nextButton = document.querySelector('#shadow-next');
    const previousCursors = [];
    let currentCursor = null;
    let nextCursor = null;

    form.addEventListener('submit', async event => {
      event.preventDefault();
      clearAlert();
      if (!queryValues()) {
        showAlert('Enter a repository and a project to inspect.');
        return;
      }
      previousCursors.length = 0;
      await loadCandidates(null);
    });

    previousButton.addEventListener('click', async () => {
      const cursor = previousCursors.at(-1);
      if (cursor === undefined) return;
      if (await loadCandidates(cursor)) previousCursors.pop();
      updatePagination();
    });

    nextButton.addEventListener('click', async () => {
      if (nextCursor === null) return;
      const previous = currentCursor;
      if (await loadCandidates(nextCursor)) previousCursors.push(previous);
      updatePagination();
    });

    async function loadCandidates(cursor) {
      clearAlert();
      setBusy(true);
      try {
        const values = queryValues();
        if (!values) return false;
        const query = new URLSearchParams({ repository: values.repository, project: values.project });
        if (cursor !== null) query.set('cursor', cursor);
        const response = await fetch('/+shadow/candidates?' + query, {
          headers: { authorization: 'Basic ' + btoa(values.user + ':' + values.password) },
        });
        if (!response.ok) {
          showAlert(errorMessage(response.status));
          return false;
        }
        const page = await response.json();
        if (!Array.isArray(page.candidates) || !(page.next_cursor === null || typeof page.next_cursor === 'string')) {
          showAlert('The shadow inspection service returned invalid data.');
          return false;
        }
        currentCursor = cursor;
        nextCursor = page.next_cursor;
        renderCandidates(page.candidates);
        return true;
      } catch {
        showAlert('The shadow inspection service could not be reached.');
        return false;
      } finally {
        setBusy(false);
      }
    }

    function renderCandidates(candidates) {
      table.querySelector('tbody').replaceChildren(...candidates.map(candidateRow));
      tableScroll.hidden = candidates.length === 0;
      results.textContent = candidates.length === 0
        ? 'No candidates resolved for this repository and project.'
        : `Loaded ${candidates.length} shadow candidates.`;
    }

    function candidateRow(candidate) {
      const row = document.createElement('tr');
      row.append(
        textCell(candidate.selected ? 'Selected' : 'Shadowed'),
        textCell(decisionLabel(candidate.decision)),
        textCell(sourceLabel(candidate.source)),
        textCell(candidate.member),
        textCell(candidate.filename),
        textCell(candidate.digest),
        textCell(reasonLabel(candidate.reason)),
        textCell(candidate.decision?.rule),
        textCell(candidate.decision?.reason),
        textCell(timestamp(candidate.decision?.next_eligible_at_unix)),
      );
      return row;
    }

    function textCell(value) {
      const cell = document.createElement('td');
      cell.textContent = value ?? '-';
      return cell;
    }

    function decisionLabel(decision) {
      if (!decision) return '-';
      const state = { allow: 'Allowed', deny: 'Denied', wait: 'Waiting' }[decision.state] ?? decision.state;
      return decision.fresh ? state : `Stale ${state}`;
    }

    function sourceLabel(source) {
      return { hosted: 'hosted upload', cached: 'cached upstream' }[source] ?? source ?? '-';
    }

    function reasonLabel(reason) {
      return {
        precedence: 'Higher-precedence member',
        fallback: 'Fallback source',
        'protected-name': 'Protected name',
      }[reason] ?? reason ?? '-';
    }

    function timestamp(value) {
      return value === null || value === undefined
        ? '-'
        : new Date(value * 1000).toISOString().replace('.000Z', 'Z');
    }

    function queryValues() {
      const values = {
        user: document.querySelector('#shadow-user').value,
        password: document.querySelector('#shadow-password').value,
        repository: document.querySelector('#shadow-repository').value.trim(),
        project: document.querySelector('#shadow-project').value.trim(),
      };
      return values.repository && values.project ? values : null;
    }

    function setBusy(busy) {
      form.querySelector('button').disabled = busy;
      previousButton.disabled = busy || previousCursors.length === 0;
      nextButton.disabled = busy || nextCursor === null;
    }

    function updatePagination() {
      previousButton.disabled = previousCursors.length === 0;
      nextButton.disabled = nextCursor === null;
    }

    function clearAlert() {
      document.querySelector('[role="alert"]')?.remove();
    }

    function showAlert(message) {
      clearAlert();
      const alert = document.createElement('p');
      alert.setAttribute('role', 'alert');
      alert.textContent = message;
      results.after(alert);
    }

    function errorMessage(status) {
      if (status === 401) return 'The username or password was not accepted.';
      if (status === 403) return 'This repository token cannot inspect shadowed candidates.';
      return 'Shadow inspection failed.';
    }
  </script>
</body>
</html>
