[package]
name = "peryx-ecosystem-pypi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The PyPI ecosystem driver for peryx: names, versions, the simple repository API, and its serving layer."

[features]
# `serving` keeps format parsing usable without HTTP and storage dependencies.
default = ["serving"]
serving = [
  "dep:peryx-driver",
  "dep:peryx-archive",
  "dep:peryx-http",
  "dep:peryx-plugin-registry",
  "dep:peryx-ha",
  "dep:peryx-events",
  "dep:peryx-index",
  "dep:peryx-search",
  "dep:peryx-policy",
  "dep:peryx-identity",
  "dep:peryx-storage",
  "dep:peryx-upstream",
  "dep:axum",
  "dep:bytes",
  "dep:base64",
  "dep:blake2",
  "dep:md5",
  "dep:csv",
  "dep:spdx",
  "dep:pep508_rs",
  "dep:email_address",
  "dep:ammonia",
  "dep:pulldown-cmark",
  "dep:rst_parser",
  "dep:rst_renderer",
  "dep:reqwest",
  "dep:thiserror",
  "dep:async-trait",
  "dep:tracing",
  "dep:tokio",
  "dep:futures-util",
  "dep:utoipa",
  "dep:zip",
  "dep:tar",
  "dep:flate2",
  "dep:tempfile",
  "dep:time",
  "dep:toml",
  "dep:anyhow",
  "dep:html5ever",
  "dep:regex",
  "dep:uuid",
]
bench = [
  "serving",
  "dep:peryx-bench",
  "dep:peryx-bench-core",
  "dep:hdrhistogram",
  "dep:clap",
  "dep:http",
  "tokio/macros",
  "tokio/rt-multi-thread",
]

[dependencies]
peryx-core.workspace = true
peryx-bench-core = { workspace = true, optional = true }
peryx-bench = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
pep440_rs = "0.7.3"
tl = "0.7.8"
web_atoms = "0.2.6"
url.workspace = true
percent-encoding.workspace = true
sha2.workspace = true
xml = { package = "xml-rs", version = "1.0" }
hdrhistogram = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
http = { workspace = true, optional = true }

peryx-driver = { workspace = true, optional = true }
peryx-archive = { workspace = true, optional = true }
peryx-http = { workspace = true, optional = true }
peryx-plugin-registry = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
peryx-ha = { workspace = true, optional = true }
peryx-events = { workspace = true, optional = true }
peryx-index = { workspace = true, optional = true }
peryx-search = { workspace = true, optional = true }
peryx-policy = { workspace = true, optional = true }
peryx-identity = { workspace = true, optional = true }
peryx-storage = { workspace = true, optional = true }
peryx-upstream = { workspace = true, optional = true }
axum = { workspace = true, features = ["multipart"], optional = true }
bytes = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
spdx = { version = "0.13", optional = true }
pep508_rs = { version = "0.9", optional = true }
email_address = { version = "0.2", default-features = false, optional = true }
reqwest = { workspace = true, features = ["gzip", "http2", "rustls-no-provider", "stream"], optional = true }
thiserror = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"], optional = true }
futures-util = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ammonia = { version = "4.1", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
rst_parser = { version = "0.4", optional = true }
rst_renderer = { version = "0.4", optional = true }
flate2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
time = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
html5ever = { version = "0.39", optional = true }
regex = { workspace = true, optional = true }

[dev-dependencies]
# The changelog reader shares one journal with every other driver, so its tests read what a real one writes.
peryx-ecosystem-oci.workspace = true
peryx-events = { workspace = true, features = ["test-util"] }
peryx-test-support.workspace = true
httpdate.workspace = true
rstest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
wiremock.workspace = true
tracing-subscriber.workspace = true
redb.workspace = true
insta.workspace = true
criterion = { workspace = true, features = ["async_tokio"] }
hdrhistogram.workspace = true
stats_alloc.workspace = true
temp-env.workspace = true

[[bin]]
name = "peryx-bench-pypi"
path = "src/bin/peryx-bench-pypi.rs"
required-features = ["bench"]
test = false
bench = false

[[bench]]
name = "serve"
harness = false
required-features = ["bench"]

[[example]]
name = "catalog_million"
required-features = ["serving"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "parse_index_html"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "name_version"
harness = false

[[bench]]
name = "parse_version"
harness = false

[[bench]]
name = "parse_version_specifiers"
harness = false

[[bench]]
name = "sorted_desc"
harness = false

[[bench]]
name = "transform"
harness = false
required-features = ["serving"]

[lints]
workspace = true
